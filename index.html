const hs=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function shuf(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solveCount(g,lim){const rw=Array(9).fill(0),cl=Array(9).fill(0),bx=Array(9).fill(0);for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i],r=(i/9)|0,c=i%9;rw[r]|=b;cl[c]|=b;bx[((r/3)|0)*3+((c/3)|0)]|=b}
let cnt=0;const go=()=>{let bi=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){const r=(i/9)|0,c=i%9,m=~(rw[r]|cl[c]|bx[((r/3)|0)*3+((c/3)|0)])&0x3FE;let k=0,x=m;while(x){k++;x&=x-1}if(k<bc){bc=k;bi=i;bm=m;if(k<=1)break}}
if(bi<0){cnt++;return cnt>=lim}if(bc===0)return false;const r=(bi/9)|0,c=bi%9,b=((r/3)|0)*3+((c/3)|0);
for(let d=1;d<=9;d++){const bt=1<<d;if(bm&bt){g[bi]=d;rw[r]|=bt;cl[c]|=bt;bx[b]|=bt;const st=go();g[bi]=0;rw[r]&=~bt;cl[c]&=~bt;bx[b]&=~bt;if(st)return true}}return false};go();return cnt}

const sol=[];for(let i=0;i<9;i++)for(let j=0;j<9;j++)sol.push(dg[((rows[i]%3)*3+Math.floor(rows[i]/3)+cols[j])%9]);

,[`聪明`,`cōngmíng`,`thông minh (tính từ)`,`这个孩子很聪明。`,`Zhège háizi hěn cōngmíng.`,`Đứa trẻ này rất thông minh.`],[`认真`,`rènzhēn`,`nghiêm túc, chăm chú`,`她学习很认真。`,`Tā xuéxí hěn rènzhēn.`,`Cô ấy học hành rất nghiêm túc.`],[`容易`,`róngyì`,`dễ (tính từ)`,`这个问题很容易。`,`Zhège wèntí hěn róngyì.`,`Câu hỏi này rất dễ.`],[`难`,`nán`,`khó (tính từ)`,`汉字有点儿难。`,`Hànzì yǒudiǎnr nán.`,`Chữ Hán hơi khó.`],[`简单`,`jiǎndān`,`đơn giản (tính từ)`,`这个方法很简单。`,`Zhège fāngfǎ hěn jiǎndān.`,`Cách này rất đơn giản.`],[`方法`,`fāngfǎ`,`phương pháp (danh từ)`,`学习需要好方法。`,`Xuéxí xūyào hǎo fāngfǎ.`,`Học tập cần có phương pháp tốt.`],[`经验`,`jīngyàn`,`kinh nghiệm (danh từ)`,`她有很多经验。`,`Tā yǒu hěn duō jīngyàn.`,`Cô ấy có rất nhiều kinh nghiệm.`],[`进步`,`jìnbù`,`tiến bộ (động từ)`,`你的汉语进步很快。`,`Nǐ de Hànyǔ jìnbù hěn kuài.`,`Tiếng Trung của bạn tiến bộ rất nhanh.`],[`坚持`,`jiānchí`,`kiên trì (động từ)`,`只要坚持，就会成功。`,`Zhǐyào jiānchí, jiù huì chénggōng.`,`Chỉ cần kiên trì thì sẽ thành công.`],[`成功`,`chénggōng`,`thành công`,`祝你成功！`,`Zhù nǐ chénggōng!`,`Chúc bạn thành công!`],[`机会`,`jīhuì`,`cơ hội (danh từ)`,`这是一个好机会。`,`Zhè shì yí ge hǎo jīhuì.`,`Đây là một cơ hội tốt.`],[`担心`,`dānxīn`,`lo lắng (động từ)`,`不用担心。`,`Búyòng dānxīn.`,`Không cần lo lắng.`],[`放松`,`fàngsōng`,`thư giãn (động từ)`,`周末我想放松一下。`,`Zhōumò wǒ xiǎng fàngsōng yíxià.`,`Cuối tuần tôi muốn thư giãn một chút.`],[`早上`,`zǎoshang`,`buổi sáng (danh từ)`,`我早上六点起床。`,`Wǒ zǎoshang liù diǎn qǐchuáng.`,`Buổi sáng tôi dậy lúc sáu giờ.`],[`晚上`,`wǎnshang`,`buổi tối (danh từ)`,`晚上我喜欢看书。`,`Wǎnshang wǒ xǐhuan kàn shū.`,`Buổi tối tôi thích đọc sách.`],[`明天`,`míngtiān`,`ngày mai (danh từ)`,`明天见！`,`Míngtiān jiàn!`,`Hẹn mai gặp!`]);
PG.push([`Hóa học`,`Water behaves unusually when it freezes: it expands, so ice floats on liquid water. This helps lakes freeze from the top down, leaving liquid water below, where fish can survive through the winter.`,`Nước có một đặc điểm khác thường khi đóng băng: nó nở ra nên băng nổi trên mặt nước. Điều này khiến hồ đóng băng từ trên xuống, để lại lớp nước lỏng bên dưới, nơi cá có thể sống sót qua mùa đông.`],
[`Thiên văn`,`Sunlight takes about eight minutes to reach Earth, so we always see the Sun as it was a little while ago. Light from other stars can travel for years or even thousands of years, which means looking at the night sky is a bit like looking into the past.`,`Ánh sáng Mặt Trời mất khoảng tám phút để tới Trái Đất, nên ta luôn thấy Mặt Trời như nó đã từng như vậy cách đây một lúc. Ánh sáng từ các ngôi sao khác có thể đi hàng năm, thậm chí hàng nghìn năm, nên ngắm bầu trời đêm cũng giống như nhìn vào quá khứ.`],
[`Tâm lý học`,`Studies of memory suggest that reviewing information at spaced intervals works better than cramming. Each review signals to the brain that the information matters, making it easier to recall later. This is the idea behind many flashcard apps.`,`Các nghiên cứu về trí nhớ cho thấy ôn lại thông tin theo những khoảng cách thời gian hiệu quả hơn học nhồi. Mỗi lần ôn báo cho não biết thông tin này quan trọng, giúp nhớ lại dễ hơn sau này. Đây là ý tưởng của nhiều ứng dụng thẻ ghi nhớ.`],
[`Động vật`,`Crows are among the most intelligent birds. They can use tools, recognize human faces, and some have been observed solving puzzles with several steps. Their large brains relative to their body size help explain these abilities.`,`Quạ là một trong những loài chim thông minh nhất. Chúng biết dùng công cụ, nhận ra khuôn mặt người, và một số con được quan sát thấy giải được các câu đố nhiều bước. Bộ não khá lớn so với cơ thể giúp giải thích những khả năng này.`],
[`Địa lý`,`The Sahara is the largest hot desert in the world and covers a huge part of northern Africa. Yet most of it is not sand dunes; much of it is rocky plateaus and gravel plains.`,`Sahara là sa mạc nóng lớn nhất thế giới, trải rộng trên một phần lớn miền bắc châu Phi. Tuy vậy, phần lớn nơi này không phải đồi cát; nhiều nơi là cao nguyên đá và đồng bằng sỏi.`],
[`Công nghệ`,`The internet began as a research network in the late 1960s called ARPANET, which connected only a handful of computers at first. The World Wide Web, which lets us browse pages connected by links, was proposed later, around 1989, by Tim Berners-Lee.`,`Internet bắt đầu từ một mạng nghiên cứu cuối thập niên 1960 tên là ARPANET, ban đầu chỉ nối vài máy tính. World Wide Web, cho phép ta duyệt các trang nối với nhau bằng liên kết, được Tim Berners-Lee đề xuất sau đó, khoảng năm 1989.`],
[`Kinh tế`,`When many people want something that is scarce, its price tends to rise. When there is plenty of it and few buyers, the price tends to fall. This simple idea of supply and demand helps explain everything from concert tickets to fruit prices.`,`Khi nhiều người muốn một thứ khan hiếm, giá của nó có xu hướng tăng. Khi hàng nhiều mà người mua ít, giá có xu hướng giảm. Ý tưởng đơn giản về cung và cầu giúp giải thích mọi thứ, từ giá vé hòa nhạc đến giá trái cây.`],
[`Âm nhạc`,`Music can change how we feel. Research suggests that listening to music we enjoy can reduce stress and lift our mood, while playing an instrument exercises many parts of the brain at once, including hearing, movement, and memory.`,`Âm nhạc có thể thay đổi cảm xúc của ta. Các nghiên cứu cho thấy nghe nhạc mình thích có thể giảm căng thẳng và nâng cao tâm trạng, còn chơi nhạc cụ thì rèn luyện nhiều vùng não cùng lúc, gồm thính giác, vận động và trí nhớ.`],
[`Ngôn ngữ học`,`Mandarin Chinese is a tonal language: the same syllable can mean different things depending on its pitch pattern. For example, the syllable ma can mean mother, hemp, horse, or scold, depending on the tone. This is why listening practice is so important.`,`Tiếng Quan Thoại là ngôn ngữ có thanh điệu: cùng một âm tiết có thể mang nghĩa khác nhau tùy cách lên xuống giọng. Ví dụ, âm tiết ma có thể là mẹ, cây gai, con ngựa hoặc mắng, tùy thanh điệu. Vì vậy luyện nghe rất quan trọng.`],
[`Môi trường`,`Tiny ocean organisms called phytoplankton produce a large share of the oxygen in our atmosphere through photosynthesis. Scientists often estimate that roughly half of Earth's oxygen comes from the ocean, which is one reason healthy seas matter to everyone.`,`Những sinh vật biển nhỏ bé gọi là thực vật phù du tạo ra một phần lớn oxy trong khí quyển nhờ quang hợp. Các nhà khoa học thường ước tính khoảng một nửa lượng oxy của Trái Đất đến từ đại dương, đó là một lý do khiến biển khỏe mạnh quan trọng với mọi người.`],
[`Lịch sử`,`The Great Wall of China was built and rebuilt over many centuries by different dynasties, not in a single project. According to a survey by Chinese authorities, its total length, counting all its branches, is more than twenty thousand kilometers.`,`Vạn Lý Trường Thành được xây và sửa lại qua nhiều thế kỷ bởi các triều đại khác nhau, không phải trong một dự án duy nhất. Theo một cuộc khảo sát của phía Trung Quốc, tổng chiều dài của nó, tính cả các nhánh, hơn hai mươi nghìn km.`],
[`Toán học`,`The number zero as a true number with its own rules took a long time to develop. Mathematicians in ancient India helped shape it, and it later spread to the Arab world and Europe, making modern arithmetic much easier.`,`Số không, với tư cách là một con số thật sự có quy tắc riêng, mất rất lâu mới hình thành. Các nhà toán học Ấn Độ cổ đại góp phần định hình nó, rồi nó lan sang thế giới Ả Rập và châu Âu, giúp số học hiện đại dễ hơn nhiều.`],
[`Y học`,`Washing your hands with soap is one of the simplest ways to prevent infections. Soap helps lift germs off the skin so water can rinse them away, which is why scrubbing for around twenty seconds is often recommended.`,`Rửa tay bằng xà phòng là một trong những cách đơn giản nhất để phòng nhiễm trùng. Xà phòng giúp tách vi khuẩn khỏi da để nước cuốn trôi, vì vậy người ta thường khuyên chà rửa khoảng hai mươi giây.`],
[`Di truyền học`,`Almost every cell in your body contains the same DNA, a long molecule that carries instructions for building and running you. If you stretched out the DNA from a single cell, it would be about two meters long.`,`Hầu hết mọi tế bào trong cơ thể bạn đều chứa cùng một bộ DNA, một phân tử dài mang chỉ dẫn để xây dựng và vận hành cơ thể. Nếu kéo thẳng DNA từ một tế bào, nó dài khoảng hai mét.`],
[`Địa chất`,`Earth's surface is broken into large pieces called tectonic plates that move very slowly, only a few centimeters a year. Where plates collide or slide past each other, earthquakes and volcanoes are more common.`,`Bề mặt Trái Đất bị chia thành những mảng lớn gọi là mảng kiến tạo, di chuyển rất chậm, chỉ vài xăng-ti-mét mỗi năm. Ở nơi các mảng va vào nhau hoặc trượt qua nhau, động đất và núi lửa xảy ra nhiều hơn.`],
[`Văn học`,`Some studies suggest that reading fiction helps people understand other people's feelings, because stories invite us to see the world through someone else's eyes. Even a few pages a day can build vocabulary and concentration over time.`,`Một số nghiên cứu cho thấy đọc tiểu thuyết giúp ta hiểu cảm xúc của người khác hơn, vì câu chuyện mời ta nhìn thế giới bằng đôi mắt của người khác. Chỉ vài trang mỗi ngày cũng có thể giúp tăng vốn từ và khả năng tập trung theo thời gian.`]);

PG.push([`Tâm lý học`,`Writing about your feelings for just a few minutes can help you understand them better. Psychologists have found that putting emotions into words may reduce their intensity, which is one reason many people enjoy keeping a diary.`,`Viết về cảm xúc chỉ vài phút có thể giúp bạn hiểu chúng rõ hơn. Các nhà tâm lý học thấy rằng gọi tên cảm xúc bằng lời có thể làm chúng dịu bớt, đó là một lý do nhiều người thích viết nhật ký.`],[`Thói quen`,`Habits form through repetition in a steady context. Rather than aiming for perfection, it often helps to start with a very small action, such as reading one page, and do it at the same time each day.`,`Thói quen hình thành nhờ lặp lại trong một bối cảnh ổn định. Thay vì cầu toàn, thường sẽ dễ hơn nếu bắt đầu bằng hành động rất nhỏ, như đọc một trang, và làm vào cùng một giờ mỗi ngày.`],[`Thiên văn`,`The Moon is slowly moving away from Earth, by about 3.8 centimeters each year. This is roughly the speed at which your fingernails grow, and it has been happening for billions of years.`,`Mặt Trăng đang từ từ rời xa Trái Đất, khoảng 3,8 cm mỗi năm. Tốc độ này gần bằng tốc độ móng tay bạn dài ra, và nó đã diễn ra hàng tỷ năm.`],[`Ngôn ngữ`,`Chinese characters are built from smaller parts. Many have a meaning part and a sound part, so learning common components makes new characters much easier to remember.`,`Chữ Hán được ghép từ những bộ phận nhỏ hơn. Nhiều chữ có phần chỉ nghĩa và phần chỉ âm, nên học các thành phần quen thuộc giúp nhớ chữ mới dễ hơn nhiều.`],[`Giấc ngủ & học tập`,`Taking short breaks while studying can improve focus. Many people work in blocks of about 25 minutes and then rest for five, which keeps the mind fresh and makes long study sessions less tiring.`,`Nghỉ ngắn khi học có thể cải thiện sự tập trung. Nhiều người học theo từng đợt khoảng 25 phút rồi nghỉ năm phút, giúp đầu óc tươi tỉnh và buổi học dài bớt mệt hơn.`],[`Địa lý`,`The Mekong River flows through six countries before reaching the sea. Its delta in southern Vietnam is one of the most productive farming regions in Southeast Asia, famous for rice, fruit, and fish.`,`Sông Mê Kông chảy qua sáu quốc gia trước khi ra biển. Đồng bằng của nó ở miền Nam Việt Nam là một trong những vùng nông nghiệp trù phú nhất Đông Nam Á, nổi tiếng với lúa gạo, trái cây và thủy sản.`]);

const PXT=[['diary','📖','Nhật ký','Diary'],['memory','🌼','Kỷ niệm','Memories'],['moment','☕','Khoảnh khắc nhỏ','Little moments'],['book','📚','Sách đã đọc và nhật ký đọc','Books and reading log'],['week','📅','Tổng kết tuần','Weekly reviews'],['note','📝','Ghi chú','Notes'],['know','🧠','Kiến thức','Knowledge'],['dump','💭','Brain Dump','Brain dump']];
let PX={from:'',to:'',on:{diary:1,memory:1,moment:1,book:1,week:1,note:0,know:0,dump:0},grp:'type',img:'s',asc:1,title:''};
function pxPreset(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=(a,b)=>ymd(new Date(a,b,1)),l=(a,b)=>ymd(new Date(a,b+1,0));
if(k==='m'){PX.from=f(y,m);PX.to=l(y,m)}else if(k==='pm'){PX.from=f(y,m-1);PX.to=l(y,m-1)}else if(k==='y'){PX.from=f(y,0);PX.to=l(y,11)}else if(k==='py'){PX.from=f(y-1,0);PX.to=l(y-1,11)}else{PX.from='';PX.to=''}}
const pxIn=d=>{d=String(d||'').slice(0,10);if(!PX.from&&!PX.to)return true;if(!d)return false;return(!PX.from||d>=PX.from)&&(!PX.to||d<=PX.to)};
const pxPh=i=>PX.img==='n'||!(i.imgs||[]).length?'':`<div class="ph ${PX.img}">${i.imgs.map(x=>`<img src="${x}" alt="">`).join('')}</div>`;

function pxEntries(){const out=[],ic=Object.fromEntries(PXT.map(x=>[x[0],x[1]]));
it('diary').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.diary&&pxIn(d))out.push({t:'diary',d,h:`<div class="en"><h3>${ic.diary} ${MOODS[i.mood]||''} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)} ${(i.date||'').slice(11,16)}</div>${clean(i.body)}${pxPh(i)}${pxTg(i)}</div>`})});
it('memory').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.memory&&pxIn(d))out.push({t:'memory',d,h:`<div class="en"><h3>${ic.memory} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)} · ${esc(OPT.cat[i.cat||0])}</div>${clean(i.body)}${i.refl?`<p><i>${esc(i.refl)}</i></p>`:''}${pxPh(i)}${pxTg(i)}</div>`})});
it('moment').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.moment&&pxIn(d))out.push({t:'moment',d,h:`<div class="en"><h3>${ic.moment} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)}</div>${pxPh(i)}${pxTg(i)}</div>`})});
it('book').forEach(b=>{const d=String(b.done||'').slice(0,10);if(PX.on.book&&b.stat==2&&pxIn(d)){const n=rdays(b.id);out.push({t:'book',d,h:`<div class="en"><h3>${ic.book} ${esc(b.title||'')}</h3><div class="meta">${esc(b.author||'')}${b.rate?' · '+'★'.repeat(b.rate):''}${b.start?' · '+fd(b.start)+' → ':' · '}${fd(b.done)}${n?' · '+n+' ngày thực đọc':''}${b.pages?' · '+b.pages+' trang':''}</div>${b.review?`<p>${esc(b.review)}</p>`:''}${String(b.quotes||'').split(/\r?\n/).filter(x=>x.trim()).map(q=>`<blockquote>${esc(q)}</blockquote>`).join('')}${pxPh(b)}</div>`})}});
it('week').forEach(i=>{const d=String(i.date||'').slice(0,10);if(PX.on.week&&pxIn(d)){const qa=T.week.f.filter(f=>/^q\d/.test(f[0])&&i[f[0]]).map(f=>`<p><b>${esc(f[1])}</b><br>${esc(i[f[0]])}</p>`).join('');out.push({t:'week',d,h:`<div class="en"><h3>${ic.week} ${esc(i.title||'')}</h3>${qa}</div>`})}});
[['note'],['know']].forEach(([k])=>it(k).forEach(i=>{const d=(i.c||'').slice(0,10);if(PX.on[k]&&pxIn(d))out.push({t:k,d,h:`<div class="en"><h3>${ic[k]} ${esc(i.title||'')}</h3><div class="meta">${fd(i.c)}</div>${clean(i.body)}${pxPh(i)}${pxTg(i)}</div>`})}));

function pxBuild(){const en=pxEntries(),sg=PX.asc?1:-1,srt=a=>a.sort((x,y)=>sg*x.d.localeCompare(y.d)),lbl=Object.fromEntries(PXT.map(x=>[x[0],x[1]+' '+T2(x[2],x[3])]));

const lg=PX.on.book?it('rlog').filter(l=>pxIn(l.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date))):[],tp=lg.reduce((a,l)=>a+(+l.pages||0),0),dd=new Set(lg.map(l=>l.date)).size;
const cnt=PXT.map(x=>[x,en.filter(e=>e.t===x[0]).length]).filter(x=>x[1]).map(([x,n])=>`${x[1]} ${n}`).join(' · ');
let body='';
if(PX.grp==='type'){PXT.forEach(([k])=>{const a=srt(en.filter(e=>e.t===k));if(a.length)body+=`<h2>${lbl[k]}</h2>`+a.map(e=>e.h).join('')})}
else{let last='';srt(en).forEach(e=>{const m=e.d?(+e.d.slice(5,7))+'/'+e.d.slice(0,4):'—';if(m!==last){last=m;body+=`<h2>${T2('Tháng','Month')} ${m}</h2>`}body+=e.h})}
if(lg.length)body+=`<h2>📖 ${T2('Nhật ký đọc sách','Reading log')}</h2><p class="meta">${dd} ${T2('ngày đọc','reading days')} · ${tp} ${T2('trang','pages')}</p><table><tr><th>${T2('Ngày','Date')}</th><th>${T2('Sách','Book')}</th><th>${T2('Số trang','Pages')}</th></tr>${lg.map(l=>{const b=byId(l.book);return`<tr><td>${fd(l.date)}</td><td>${esc(b?b.title:'—')}</td><td>${l.pages}${l.est?' <span class="meta">('+T2('ước lượng','estimated')+')</span>':''}</td></tr>`}).join('')}</table>`;
return`<div class="cover"><h1>${esc(PX.title||((D.name?D.name+' – ':'')+'Minimal Dairy'))}</h1><div>${dr}</div><div class="sm">${cnt||T2('Không có mục nào trong khoảng này','Nothing in this range')}${lg.length?` · 📖 ${tp} ${T2('trang đã đọc','pages read')}`:''}</div><p class="meta" style="margin-top:30px">${T2('Tạo ngày','Created on')} ${fd(new Date())}</p></div>${body||''}`}

let cur=null;
function openEdit(id){cur=byId(id);if(!cur)return;const t=T[cur.t];
$('#mb').innerHTML=`<div class="bar"><h2>${t.i} ${t.n}</h2><span class="mut" id="ms2"></span></div>`+t.f.map(([k,l,ty,o])=>{const v=cur[k];let c='';
if(ty==='txt')c=`<input data-k="${k}" value="${esc(v)}">`;
else if(ty==='num')c=`<input type="number" min="0" data-k="${k}" value="${esc(v)}">`;
else if(ty==='date')c=`<input type="date" data-k="${k}" value="${esc(v)}">`;
else if(ty==='dt')c=`<input type="datetime-local" data-k="${k}" value="${esc(v)}">`;
else if(ty==='area')c=`<textarea data-k="${k}">${esc(v)}</textarea>`;
else if(ty==='sel')c=`<select data-k="${k}">${OPT[o].map((x,n)=>`<option value="${n}" ${n==(v||0)?'selected':''}>${x}</option>`).join('')}</select>`;
else if(ty==='chk')return`<label><input type="checkbox" style="width:auto;margin:0 6px 12px 0" data-k="${k}" ${v?'checked':''}>${l}</label><br>`;
else if(ty==='mood')c=`<div class="ms">${MOODS.map((m,n)=>`<span data-md="${n}" class="${v===n?'on':''}">${m}</span>`).join('')}</div>`;
else if(ty==='rich')c=`<div class="tb"><button class="btn g" data-c="bold"><b>B</b></button><button class="btn g" data-c="italic"><i>I</i></button><button class="btn g" data-c="insertUnorderedList">•</button></div><div class="rich" contenteditable data-k="${k}">${clean(v)}</div>`;
else if(ty==='img')c=`<div class="th" id="th2"></div><div class="chips"><button type="button" class="btn" data-cam="fc">📷 Chụp ảnh</button></div><input type="file" accept="image/*" capture="environment" id="fc" style="display:none"><label>Hoặc chọn ảnh từ thư viện</label><input type="file" accept="image/*" multiple id="fi">`;
else if(ty==='pick')c=`<div style="max-height:240px;overflow:auto;margin-bottom:12px">${D.items.filter(x=>['memory','moment','voice'].includes(x.t)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(x=>`<label style="display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--ink);font-size:15px"><input type="checkbox" style="width:auto;margin:0" data-pk="${x.id}" ${(cur.ids||[]).includes(x.id)?'checked':''}>${T[x.t].i} ${esc(x.title||'Không tên')} <span class="mut">${fd(x.date)}</span></label>`).join('')||'<span class="mut">Chưa có kỷ niệm nào để thêm.</span>'}</div>`;
else if(ty==='voice')c='<div id="vbox"></div>';
else if(ty==='ktags')c=`<div class="chips">${knTags().filter(t=>!(cur.tags||'').split(',').map(x=>x.trim()).includes(t)).map(t=>`<button class="btn g" data-at="${esc(t)}" style="padding:3px 10px">${esc(t)}</button>`).join('')||'<span class="mut">Chưa có tag nào, hãy gõ tag mới ở ô trên.</span>'}</div>`;
else if(ty==='bstat')c=`<div class="card" style="margin-bottom:12px;line-height:1.8">${bstats(cur)}</div>`;
else if(ty==='wsum')c=`<div class="card" style="margin-bottom:12px">${wstats(wk(cur.date||ymd(new Date())))}</div>`;
return`<label>${l}</label>${c}`}).join('')+`<div class="bar"><button class="btn d" id="del">Xóa</button><button class="btn" id="cl">Xong</button></div>`;
$('#m').classList.add('on');ths();vui()}
const ths=()=>{const e=$('#th2');if(e)e.innerHTML=(cur.imgs||[]).map((s,n)=>`<div><img src="${s}" alt=""><b data-ri="${n}">×</b></div>`).join('')};
const touch=()=>{cur.u=Date.now();delete cur.nw;save();const e=$('#ms2');if(e)e.textContent='Đang tự động lưu…'};
function closeEdit(){if(cur){const e=!cur.title&&!plain(cur.body).trim()&&!(cur.imgs||[]).length&&!cur.review&&!cur.audio&&!(cur.ids||[]).length;if(cur.nw&&(e||cur.pq))rm(cur);flush()}cur=null;$('#m').classList.remove('on');render()}
function newItem(t){const n=new Date(),i={id:uid(),t,c:n.toISOString(),u:Date.now(),nw:1};if(t==='diary')i.date=new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,16);else if(t==='memory'||t==='moment'||t==='voice')i.date=ymd(n);D.items.push(i);openEdit(i.id)}
