function msess(s){if(!('mediaSession' in navigator))return;try{const cv=(s.imgs||[])[0];navigator.mediaSession.metadata=new MediaMetadata({title:s.title||'Bài hát',artist:s.artist||'',album:'Minimal Dairy',artwork:cv?[{src:cv,sizes:'512x512'}]:[]})}catch(e){}}
function initAudio(){AU.onplay=()=>{MS.pl=true;try{navigator.mediaSession.playbackState='playing'}catch(e){}mpUpdate();npUpdate()};AU.onpause=()=>{MS.pl=false;try{navigator.mediaSession.playbackState='paused'}catch(e){}mpUpdate();npUpdate()};
AU.onended=()=>{if(MS.rp===2){AU.currentTime=0;AU.play()}else mnext(1)};
AU.onloadedmetadata=()=>{const s=curSong();if(s&&AU.duration&&!s.dur){s.dur=AU.duration;save()}npUpdate()};
AU.ontimeupdate=()=>{npUpdate();const n=Date.now();if(n-lastPos>4000&&AU.duration){lastPos=n;try{navigator.mediaSession.setPositionState({duration:AU.duration,playbackRate:1,position:Math.min(AU.currentTime,AU.duration)})}catch(e){}}};
try{const m=navigator.mediaSession;m.setActionHandler('play',()=>AU.play());m.setActionHandler('pause',()=>AU.pause());m.setActionHandler('previoustrack',()=>mnext(-1));m.setActionHandler('nexttrack',()=>mnext(1));m.setActionHandler('seekto',d=>{AU.currentTime=d.seekTime})}catch(e){}}
function lyUpdate(s,c){const box=$('#ly');if(!box||SY)return;if(!LC||LC.k!==s.id+'|'+s.lrc){LC={k:s.id+'|'+s.lrc,...parseLrc(s.lrc),i:-2}}if(LC.plain)return;const t=c+(s.lo||0)+.15;let i=-1;for(let k=0;k<LC.L.length;k++){if(LC.L[k].t<=t)i=k;else break}
if(i===LC.i)return;LC.i=i;[...box.children].forEach((e,k)=>e.classList.toggle('on',k===i));const e=box.children[i];if(e){const y=e.offsetTop-box.clientHeight/2+e.clientHeight/2;if(box.scrollTo)box.scrollTo({top:y,behavior:'smooth'});else box.scrollTop=y}}

const cv=$('#cv');if(cv)cv.classList.toggle('pl',MS.pl);const mb=$('#mpb');if(mb)mb.style.width=(d?c/d*100:0)+'%';if(s)lyUpdate(s,c)}

const hs=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function shuf(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solveCount(g,lim){const rw=Array(9).fill(0),cl=Array(9).fill(0),bx=Array(9).fill(0);for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i],r=(i/9)|0,c=i%9;rw[r]|=b;cl[c]|=b;bx[((r/3)|0)*3+((c/3)|0)]|=b}
let cnt=0;const go=()=>{let bi=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){const r=(i/9)|0,c=i%9,m=~(rw[r]|cl[c]|bx[((r/3)|0)*3+((c/3)|0)])&0x3FE;let k=0,x=m;while(x){k++;x&=x-1}if(k<bc){bc=k;bi=i;bm=m;if(k<=1)break}}
if(bi<0){cnt++;return cnt>=lim}if(bc===0)return false;const r=(bi/9)|0,c=bi%9,b=((r/3)|0)*3+((c/3)|0);
for(let d=1;d<=9;d++){const bt=1<<d;if(bm&bt){g[bi]=d;rw[r]|=bt;cl[c]|=bt;bx[b]|=bt;const st=go();g[bi]=0;rw[r]&=~bt;cl[c]&=~bt;bx[b]&=~bt;if(st)return true}}return false};go();return cnt}

const sol=[];for(let i=0;i<9;i++)for(let j=0;j<9;j++)sol.push(dg[((rows[i]%3)*3+Math.floor(rows[i]/3)+cols[j])%9]);
const want={e:40,m:34,h:29}[lv],g=sol.slice();let left=81;for(const i of shuf([...Array(81).keys()],r)){if(left<=want)break;const v=g[i];g[i]=0;if(solveCount(g.slice(),2)!==1)g[i]=v;else left--}return{p:g.join(''),s:sol.join('')}}
