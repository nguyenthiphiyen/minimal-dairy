.row.done span{text-decoration:line-through;opacity:.5}.row input{width:auto;margin:0}.row span{flex:1;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips .btn{padding:6px 12px}
.fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;font-size:28px;box-shadow:var(--sh);z-index:5}
#m{position:fixed;inset:0;background:rgba(40,38,34,.45);display:none;z-index:9;align-items:center;justify-content:center;padding:14px}
#m.on{display:flex}#m .box{background:var(--bg);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px}

.rich img{max-width:100%}.tb{display:flex;gap:6px}.tb button{padding:4px 12px}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.th div{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.th b{position:absolute;top:-6px;right:-6px;background:var(--peach);color:#45433E;border-radius:50%;width:22px;height:22px;text-align:center;cursor:pointer}
.ms{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}.ms span{font-size:26px;cursor:pointer;padding:2px 6px;border-radius:12px}.ms .on{background:var(--y)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{border:0;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 0;font:inherit;cursor:pointer;position:relative}.day.sel{background:var(--y);color:#45433E}.day u{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--sage)}
@media(max-width:760px){body{flex-direction:column-reverse}nav{width:100%;flex-direction:row;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto}nav b{display:none}nav a{padding:8px 11px;font-size:14px}main{padding-bottom:140px}.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

let FT='';function gs(){const q=($('#gq')||{}).value||'',a=D.items.filter(i=>(!FT||(FT==='fav'?i.fav:i.t===FT))&&(!q||txt(i).includes(q.toLowerCase()))).sort((x,y)=>y.u-x.u);$('#L').innerHTML=a.length?`<div class="grid">${a.map(i=>i.t==='task'?`<div class="card" data-o="${i.id}">✅ ${esc(i.title)}</div>`:card(i)).join('')}</div>`:'<p class="mut">Không tìm thấy gì.</p>'}
function cfg(){const sz=(JSON.stringify(D).length/1048576).toFixed(2);return`<h1>⚙️ Cài đặt</h1><br><div class="card"><label>Tên của bạn</label><input id="nm" value="${esc(D.name)}"><label>Giao diện</label><select id="th"><option value="">Theo thiết bị</option><option value="light">Sáng</option><option value="dark">Tối</option></select></div><br>
${SBON&&S?`<div class="card"><h3>Tài khoản</h3><p class="mut">${esc(S.user.email)} · dữ liệu đồng bộ giữa các thiết bị</p><button class="btn g" id="so">Đăng xuất</button></div><br>`:''}<div class="card"><h3>Sao lưu dữ liệu</h3><p class="mut">Dữ liệu nằm trong trình duyệt này (IndexedDB), ${D.items.length} mục, khoảng ${sz} MB. Hãy xuất bản sao lưu thường xuyên để không mất dữ liệu khi xóa dữ liệu trình duyệt hoặc đổi máy.</p><button class="btn" id="ex">Xuất JSON (đầy đủ)</button> <button class="btn g" id="exm">Xuất Markdown</button> <button class="btn g" id="exc">Xuất CSV</button> <button class="btn" id="exz">Xuất kèm ảnh (ZIP)</button><p><label>Nhập từ file JSON hoặc ZIP (gộp vào dữ liệu hiện có)</label><input type="file" id="im" accept=".json,.zip"></p></div>`}
let CM=new Date(),CD=ymd(new Date()),TY='',TMo='';CM.setDate(1);
function cal(){const y=CM.getFullYear(),m=CM.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),mk={};
D.items.forEach(i=>{if(i.t==='diary'||i.t==='memory'){const d=(i.date||'').slice(0,10);if(d)(mk[d]=mk[d]||[]).push(i)}});
let c='';for(let k=0;k<first;k++)c+='<i></i>';
for(let d=1;d<=days;d++){const s=ymd(new Date(y,m,d));c+=`<button class="day ${s===CD?'sel':''}" data-day="${s}">${d}${mk[s]?'<u></u>':''}</button>`}
const sel=mk[CD]||[];
return`<div class="bar"><h1>📅 Lịch</h1><div><button class="btn g" data-cm="-1">‹</button> <b>Tháng ${m+1}/${y}</b> <button class="btn g" data-cm="1">›</button></div></div><div class="card"><div class="cg">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<small class="mut">${x}</small>`).join('')}${c}</div></div><div class="bar" style="margin-top:18px"><h3>${fd(CD)}</h3><button class="btn" data-nd="${CD}">+ Viết nhật ký ngày này</button></div>${sel.length?`<div class="grid">${sel.map(card).join('')}</div>`:'<p class="mut">Chưa có gì trong ngày này.</p>'}`}
function tl(){const ev=[];D.items.forEach(i=>{if(i.t==='diary'||i.t==='memory')ev.push([(i.date||'').slice(0,10),i]);else if(i.t==='book'&&i.stat==2&&i.done)ev.push([i.done,i])});
ev.sort((a,b)=>b[0].localeCompare(a[0]));const ys=[...new Set(ev.map(e=>e[0].slice(0,4)).filter(Boolean))],f=ev.filter(e=>e[0]&&(!TY||e[0].startsWith(TY))&&(!TMo||e[0].slice(5,7)===TMo));
let out='',last='';f.forEach(([d,i])=>{const k=d.slice(0,7);if(k!==last){last=k;out+=`<h3 style="margin:20px 0 8px">Tháng ${+k.slice(5)}/${k.slice(0,4)}</h3>`}out+=`<div class="row" data-o="${i.id}" style="cursor:pointer"><span class="mut" style="flex:none;width:60px">${d.slice(8)}/${d.slice(5,7)}</span><span>${T[i.t].i} ${esc(i.title||'Không tên')}${i.t==='book'?' (đã đọc xong)':''}</span></div>`});
return`<h1>🕰️ Dòng thời gian</h1><br><div class="chips"><select id="ty" style="width:auto"><option value="">Mọi năm</option>${ys.map(y=>`<option ${y===TY?'selected':''}>${y}</option>`).join('')}</select><select id="tm" style="width:auto"><option value="">Mọi tháng</option>${Array.from({length:12},(_,k)=>{const v=String(k+1).padStart(2,'0');return`<option value="${v}" ${v===TMo?'selected':''}>Tháng ${k+1}</option>`}).join('')}</select></div>${out||'<p class="mut">Chưa có gì để hiển thị.</p>'}`}
function habits(){const hs=it('habit'),ds=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return d}),td=new Date(),dim=td.getDate(),pre=ymd(td).slice(0,7);
return`<div class="bar"><h1>🌱 Thói quen</h1><button class="btn" data-n="habit">+ Thêm</button></div>`+(hs.length?hs.map(h=>{const lg=h.log||{},mc=Object.keys(lg).filter(k=>k.startsWith(pre)).length;let sk=0;for(let k=0;k<400;k++){const d=new Date();d.setDate(d.getDate()-k);if(lg[ymd(d)])sk++;else if(k)break}
return`<div class="card" style="margin-bottom:14px"><div class="bar" style="margin-bottom:8px"><b data-o="${h.id}" style="cursor:pointer">${esc(h.title||'Không tên')}</b><span class="mut">${sk?'🔥 '+sk+' ngày liên tiếp':'Bắt đầu lại từ hôm nay nhé'}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${ds.map(d=>{const s=ymd(d);return`<div style="text-align:center"><small class="mut">${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}<br>${d.getDate()}</small><br><button class="day ${lg[s]?'sel':''}" data-hb="${h.id}|${s}" style="width:38px">${lg[s]?'✓':'·'}</button></div>`}).join('')}</div><div class="pg"><i style="width:${Math.round(mc/dim*100)}%"></i></div><div class="mut">Tháng này: ${mc}/${dim} ngày</div></div>`}).join(''):'<p class="mut">Chưa có thói quen nào. Bấm “Thêm” để bắt đầu nhẹ nhàng nhé.</p>')}
const VIEW={home,search,cfg,habits,cal,tl};
function render(){const r=location.hash.slice(1)||'home';const lo=SBON&&!S;$('#nav').style.display=lo?'none':'';$('#fab').style.display=lo?'none':'';if(lo){$('#v').innerHTML=loginV();return}$('#nav').innerHTML='<b>Minimal Dairy</b>'+NAV.map(([k,i,l])=>`<a class="${k===r?'on':''}" href="#${k}">${i} ${l}</a>`).join('')+`<span class="mut" id="st" style="padding:10px 12px">${st}</span>`;
$('#v').innerHTML=VIEW[r]?VIEW[r]():TYPE[r]?page(r):home();if(r==='cfg')$('#th').value=D.theme||'';if(r==='search')gs();document.documentElement.dataset.theme=D.theme||''}
// ---- editor ----
let cur=null;
function openEdit(id){cur=byId(id);if(!cur)return;const t=T[cur.t];
$('#mb').innerHTML=`<div class="bar"><h2>${t.i} ${t.n}</h2><span class="mut" id="ms2"></span></div>`+t.f.map(([k,l,ty,o])=>{const v=cur[k];let c='';
if(ty==='txt')c=`<input data-k="${k}" value="${esc(v)}">`;
else if(ty==='num')c=`<input type="number" min="0" data-k="${k}" value="${esc(v)}">`;
else if(ty==='date')c=`<input type="date" data-k="${k}" value="${esc(v)}">`;
else if(ty==='dt')c=`<input type="datetime-local" data-k="${k}" value="${esc(v)}">`;
else if(ty==='area')c=`<textarea data-k="${k}">${esc(v)}</textarea>`;
else if(ty==='sel')c=`<select data-k="${k}">${OPT[o].map((x,n)=>`<option value="${n}" ${n==(v||0)?'selected':''}>${x}</option>`).join('')}</select>`;
else if(ty==='chk')return`<label><input type="checkbox" style="width:auto;margin:0 6px 12px 0" data-k="${k}" ${v?'checked':''}>${l}</label><br>`;
else if(ty==='mood')c=`<div class="ms">${MOODS.map((m,n)=>`<span data-md="${n}" class="${v===n?'on':''}">${m}</span>`).join('')}</div>`;
else if(ty==='rich')c=`<div class="tb"><button class="btn g" data-c="bold"><b>B</b></button><button class="btn g" data-c="italic"><i>I</i></button><button class="btn g" data-c="insertUnorderedList">•</button></div><div class="rich" contenteditable data-k="${k}">${clean(v)}</div>`;
else if(ty==='img')c=`<div class="th" id="th2"></div><input type="file" accept="image/*" multiple id="fi">`;
return`<label>${l}</label>${c}`}).join('')+`<div class="bar"><button class="btn d" id="del">Xóa</button><button class="btn" id="cl">Xong</button></div>`;
$('#m').classList.add('on');ths()}
const ths=()=>{const e=$('#th2');if(e)e.innerHTML=(cur.imgs||[]).map((s,n)=>`<div><img src="${s}" alt=""><b data-ri="${n}">×</b></div>`).join('')};
const touch=()=>{cur.u=Date.now();delete cur.nw;save();const e=$('#ms2');if(e)e.textContent='Đang tự động lưu…'};
function closeEdit(){if(cur){const e=!cur.title&&!plain(cur.body).trim()&&!(cur.imgs||[]).length&&!cur.review;if(cur.nw&&e)rm(cur);flush()}cur=null;$('#m').classList.remove('on');render()}
function newItem(t){const n=new Date(),i={id:uid(),t,c:n.toISOString(),u:Date.now(),nw:1};if(t==='diary')i.date=new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,16);else if(t==='memory')i.date=ymd(n);D.items.push(i);openEdit(i.id)}
function img(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,(AS?1600:900)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);{if(AS)c.toBlob(async b=>{try{ok((await AS.upload(b,{type:'image/jpeg'})).url)}catch(e){ok(c.toDataURL('image/jpeg',.7))}},'image/jpeg',.85);else ok(c.toDataURL('image/jpeg',.7))}};im.onerror=()=>ok(null);im.src=r.result};r.readAsDataURL(file)})}
// ---- events ----
document.addEventListener('click',async e=>{const g=s=>e.target.closest(s);let x;
if(g('#gl'))return sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
if(g('#se')){const em=$('#em').value.trim();if(!em)return;const{error}=await sb.auth.signInWithOtp({email:em});$('#lm').textContent=error?'Lỗi: '+error.message:'Đã gửi mã tới email. Nhập mã bên dưới.';if(!error)$('#ot').style.display='block';return}
if(g('#vc')){const{data,error}=await sb.auth.verifyOtp({email:$('#em').value.trim(),token:$('#cd').value.trim(),type:'email'});if(error)return $('#lm').textContent='Mã chưa đúng: '+error.message;S=data.session;return sync()}
if(g('#so')){await flush();await sb.auth.signOut();D={items:[],name:'',theme:'',del:[],lp:0,P:{}};P=D.P;C=null;DP=new Set();await flush();return render()}
if(g('#fab'))return qa();
if(x=g('[data-n]')){$('#m').classList.contains('on')&&0;return newItem(x.dataset.n)}
if(x=g('[data-o]'))return openEdit(x.dataset.o);
if(x=g('[data-hb]')){const[a,b]=x.dataset.hb.split('|'),h=byId(a);h.log=h.log||{};if(h.log[b])delete h.log[b];else h.log[b]=1;h.u=Date.now();save();return render()}
if(x=g('[data-cm]')){CM.setMonth(CM.getMonth()+ +x.dataset.cm);return render()}
if(x=g('[data-day]')){CD=x.dataset.day;return render()}
if(x=g('[data-nd]')){newItem('diary');cur.date=x.dataset.nd+'T'+cur.date.slice(11);save();return openEdit(cur.id)}
if(x=g('[data-md]')){cur.mood=+x.dataset.md;touch();return openEdit(cur.id)}
if(x=g('[data-c]')){e.preventDefault();return document.execCommand(x.dataset.c)}
if(x=g('[data-ri]')){cur.imgs.splice(+x.dataset.ri,1);touch();return ths()}
if(x=g('[data-f]')){F=x.dataset.f;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('g',b!==x));return $('#L').innerHTML=list('book')}
if(x=g('[data-ft]')){FT=x.dataset.ft;document.querySelectorAll('[data-ft]').forEach(b=>b.classList.toggle('g',b!==x));return gs()}
if(g('#cl'))return closeEdit();
if(g('#del')){if(confirm('Xóa mục này? Thao tác này không thể hoàn tác.')){rm(cur);cur=null;flush();$('#m').classList.remove('on');render()}return}
if(e.target.id==='m')return closeEdit();
if(g('#ex'))return dl('minimal-dairy-backup.json',JSON.stringify(D));
if(g('#exm'))return dl('minimal-dairy.md',D.items.filter(i=>i.t!=='task'&&i.t!=='habit').map(i=>`## ${i.title||'Không tên'}\n*${i.t} · ${when(i)||''}*\n\n${plain(i.body||i.review||'')}\n${i.refl||''}\n${i.quotes||''}\n`).join('\n'));
if(g('#exz'))return zipEx();
if(g('#exc'))return dl('minimal-dairy.csv','\ufefftype,title,date,tags,done\n'+D.items.map(i=>[i.t,i.title,when(i),i.tags,i.done?1:0].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'))});
async function dl(name,data){try{const d=typeof claude!=='undefined'?await claude.use('downloads'):null;if(!d&&typeof claude==='undefined'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();return}if(!d)return alert('Tải xuống không khả dụng ở đây.');await d.save({filename:name,data:new Blob([data])})}catch(e){if(e&&e.code!=='declined')alert('Không xuất được: '+(e.message||e))}}
async function zipEx(){if(!window.JSZip)return alert('Chưa tải được thư viện nén, hãy thử lại sau.');const z=new JSZip(),c=JSON.parse(JSON.stringify(D));let n=0,bad=0;
for(const i of c.items)if(i.imgs)for(let k=0;k<i.imgs.length;k++){try{const b=await(await fetch(i.imgs[k])).blob();z.file('images/'+(++n)+'.jpg',b);i.imgs[k]='images/'+n+'.jpg'}catch(e){bad++}}
z.file('backup.json',JSON.stringify(c));if(bad)alert(bad+' ảnh không tải được, giữ nguyên đường dẫn cũ trong bản sao lưu.');
dl('minimal-dairy-backup.zip',await z.generateAsync({type:'blob'}))}
async function up(b){if(AS)try{return(await AS.upload(b,{type:'image/jpeg'})).url}catch(e){}return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})}
function qa(){$('#mb').innerHTML='<h2>Thêm nhanh</h2><br><div class="chips">'+Object.keys(T).map(t=>`<button class="btn" data-n="${t}">${T[t].i} ${T[t].n}</button>`).join('')+'</div><button class="btn g" id="cl">Đóng</button>';$('#m').classList.add('on')}
document.addEventListener('input',async e=>{const el=e.target;
if(el.id==='q'){Q=el.value;return $('#L').innerHTML=list(TYPE[location.hash.slice(1)])}
if(el.id==='gq')return gs();
if(el.id==='nm'){D.name=el.value;return save()}
if(el.id==='fi'){for(const f of el.files){const s=await img(f);if(s)(cur.imgs=cur.imgs||[]).push(s)}el.value='';touch();return ths()}
if(cur&&el.dataset.k){const k=el.dataset.k;cur[k]=el.isContentEditable?el.innerHTML:el.type==='checkbox'?el.checked:el.tagName==='SELECT'?+el.value:el.type==='number'?+el.value:el.value;touch()}});
document.addEventListener('change',async e=>{const el=e.target;
if(el.id==='ty'){TY=el.value;return render()}
if(el.id==='tm'){TMo=el.value;return render()}
if(el.id==='th'){D.theme=el.value;save();return render()}
if(el.dataset.k&&el.type==='checkbox'&&!cur){const i=byId(el.dataset.k);if(i){if(el.checked&&i.rec>0&&i.due){const d=new Date(i.due),n=[0,1,7,0][i.rec];i.rec==3?d.setMonth(d.getMonth()+1):d.setDate(d.getDate()+n);i.due=ymd(d)}else i.done=el.checked;i.u=Date.now();save();render()}}
if(el.id==='im'&&el.files[0]){try{let j;const f=el.files[0];if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(f);j=JSON.parse(await z.file('backup.json').async('string'));for(const i of j.items||[])if(!byId(i.id)&&i.imgs)for(let k=0;k<i.imgs.length;k++)if(/^images\//.test(i.imgs[k])){const b=await z.file(i.imgs[k]).async('blob');i.imgs[k]=await up(b)}}else j=JSON.parse(await f.text());if(!Array.isArray(j.items))throw 0;const have=new Set(D.items.map(i=>i.id));let n=0;j.items.forEach(i=>{if(i&&i.id&&T[i.t]&&!have.has(i.id)){D.items.push(i);n++}});await flush();alert('Đã nhập '+n+' mục mới.');render()}catch(x){alert('File không hợp lệ, dữ liệu hiện tại không bị thay đổi.')}}});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',()=>{if(cur)flush()});
(async()=>{const d=await load();if(d&&Array.isArray(d.items))D=d;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(SBON){sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit'}});const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));LE=q.get('error_description')||h.get('error_description')||'';const r=await sb.auth.getSession();S=r.data.session;if(!S&&!LE&&(q.has('code')||h.has('access_token')))LE='Đăng nhập chưa hoàn tất. Hãy mở link bằng Safari/Chrome thường (không mở trong app khác) rồi thử lại.';if(location.search)history.replaceState({},'',location.pathname+location.hash);sb.auth.onAuthStateChange((ev,x)=>{S=x;if(ev==='SIGNED_OUT'){C=null;render()}})}P=D.P=D.P||{};render();sync();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&C)sync()})})();
</script></body></html>
