<style>

:root[data-theme=dark]{--bg:#2a2926;--card:#35332f;--cream:#403d37;--ink:#f1ece0;--mut:#b3aea1;--sh:0 4px 18px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;display:flex}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
nav{width:210px;padding:22px 14px;background:var(--card);display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
nav b{font:600 22px Fraunces,serif;padding:0 10px 14px}
nav a{padding:10px 12px;border-radius:14px;color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
nav a.on,nav a:hover{background:var(--y)}nav a.on{color:#45433E}
main{flex:1;overflow:auto;padding:28px clamp(16px,4vw,44px) 110px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px}
.btn{background:var(--y);color:#45433E;border:0;border-radius:14px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--cream);color:var(--ink)}.btn[disabled]{opacity:.35;cursor:default}.btn.d{background:var(--peach);color:#45433E}
input,select,textarea{font:inherit;color:var(--ink);background:var(--cream);border:0;border-radius:14px;padding:10px 12px;width:100%;margin:4px 0 12px}
textarea{min-height:90px}label{font-size:13px;color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mas{columns:220px;column-gap:14px}.mas .card{break-inside:avoid;margin-bottom:14px;padding:0;overflow:hidden}
.mas img,.cov{width:100%;display:block}.pad{padding:12px 14px}
.cov{aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:var(--y2)}
.mut{color:var(--mut);font-size:13px}.tag{background:var(--y2);color:#45433E;border-radius:10px;padding:1px 8px;font-size:12px;margin-right:4px}
.pg{height:6px;background:var(--cream);border-radius:6px;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:var(--sage)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--cream)}
.row.done span{text-decoration:line-through;opacity:.5}.row input{width:auto;margin:0}.row span{flex:1;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips .btn{padding:6px 12px}
.fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;font-size:28px;box-shadow:var(--sh);z-index:5}
#m{position:fixed;inset:0;background:rgba(40,38,34,.45);display:none;z-index:9;align-items:center;justify-content:center;padding:14px}
#m.on{display:flex}#m .box{background:var(--bg);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.rich{min-height:160px;background:var(--cream);border-radius:14px;padding:12px;margin:4px 0 12px;outline:0}
.rich img{max-width:100%}.tb{display:flex;gap:6px}.tb button{padding:4px 12px}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.th div{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.th b{position:absolute;top:-6px;right:-6px;background:var(--peach);color:#45433E;border-radius:50%;width:22px;height:22px;text-align:center;cursor:pointer}
.ms{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}.ms span{font-size:26px;cursor:pointer;padding:2px 6px;border-radius:12px}.ms .on{background:var(--y)}
.np{text-align:center;background:linear-gradient(160deg,var(--y2),var(--y));color:#45433E;border-radius:28px;padding:22px 16px;box-shadow:var(--sh);margin-bottom:18px}
.np .btn.g{background:rgba(255,255,255,.65);color:#45433E}
.cv{width:min(210px,58vw);aspect-ratio:1;margin:0 auto 14px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:70px;background:linear-gradient(135deg,var(--peach),var(--sage));box-shadow:0 12px 30px rgba(69,67,62,.22),0 0 0 10px rgba(255,255,255,.55);animation:spin 16s linear infinite;animation-play-state:paused}
.cv.pl{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}
.np input[type=range]{padding:0;margin:10px 0 2px;background:none;accent-color:var(--acc);height:22px}
.ct{display:flex;justify-content:center;align-items:center;gap:12px;margin:6px 0 4px}.ct button{border:0;background:rgba(255,255,255,.7);color:#45433E;border-radius:50%;width:44px;height:44px;font-size:17px;cursor:pointer}.ct .pp{width:64px;height:64px;font-size:26px;background:var(--y)}.ct .on{background:var(--peach)}
.ly{height:230px;overflow-y:auto;position:relative;margin-top:12px;padding:100px 8px;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.ll{padding:6px 0;font-size:17px;opacity:.4;transition:all .3s;cursor:pointer}.ll.on{opacity:1;font-size:21px;font-weight:700}.ly.pn .ll{opacity:.85;cursor:default}
.mc{width:44px;height:44px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--peach),var(--sage));display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}.mc img{width:100%;height:100%;object-fit:cover}
.el{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp{display:none!important;position:fixed;left:12px;right:84px;bottom:20px;z-index:6;display:none;align-items:center;gap:10px;background:var(--card);color:var(--ink);border-radius:20px;box-shadow:var(--sh);padding:8px 12px 10px}
.mb{border:0;background:var(--y);color:#45433E;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;flex:none}

textarea[data-k=lrc]{min-height:220px}

.dc{border-radius:22px;padding:16px 18px;box-shadow:var(--sh);color:#45433E}.dc h2{margin:4px 0}.dc .lb{font-size:13px;font-weight:700;opacity:.75}.dc p{margin:8px 0}.dc .btn.g{background:rgba(255,255,255,.7);color:#45433E}

.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5.2vw,24px);border:1px solid var(--cream);cursor:pointer;color:#5b7fa8;user-select:none}
.sc.gv{color:var(--ink);font-weight:800}.sc.br{border-right:2px solid var(--ink)}.sc.bb{border-bottom:2px solid var(--ink)}

.npd{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:0 auto 10px}.npd .btn{padding:12px 0;font-size:18px}
#lb{position:fixed;inset:0;background:rgba(20,18,16,.95);z-index:60;display:none;flex-direction:column}#lb.on{display:flex}

#lb button{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;z-index:2}

main img,#mb .th img{cursor:zoom-in}

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{border:0;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 0;font:inherit;cursor:pointer;position:relative}.day.sel{background:var(--y);color:#45433E}.day u{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--sage)}

.ic{object-fit:contain;vertical-align:middle;flex:none}h1 .ic{margin-right:4px}

const clean=h=>{const d=document.createElement('template');d.innerHTML=h||'';d.content.querySelectorAll('script,iframe,object,embed,style').forEach(e=>e.remove());d.content.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))e.removeAttribute(a.name)}));return d.innerHTML};

ke the time meant for what does."],["Đôi khi, trưởng thành là biết chấp nhận rằng mình không thể cứu tất cả mọi người.","Sometimes growing up means accepting that you can't save everyone."],["Hãy học cách tận hưởng những ngày bình yên mà không cần chờ đợi một sự kiện đặc biệt.","Learn to enjoy peaceful days without waiting for a special occasion."],["Động lực giúp bạn bắt đầu, nhưng kỷ luật giúp bạn đi đến cuối cùng.","Motivation helps you start, but discipline carries you to the end."],["Đừng ngại có những ước mơ lớn hơn hoàn cảnh hiện tại của bạn.","Don't be afraid to dream bigger than your present circumstances."],["Một năm sau, bạn sẽ biết ơn phiên bản hôm nay đã không bỏ cuộc.","A year from now, you'll be grateful to today's version of you who didn't give up."],["Đừng chỉ thu thập thông tin, hãy học cách kết nối và vận dụng chúng.","Don't just collect information; learn to connect it and put it to use."],["Bạn không thể kiểm soát mọi kết quả, nhưng có thể kiểm soát nỗ lực của mình.","You can't control every outcome, but you can control your effort."],["Hãy đối xử với bản thân bằng sự dịu dàng mà bạn vẫn dành cho những người mình yêu quý.","Treat yourself with the same tenderness you give to the people you love."],["Có những cánh cửa chỉ mở ra sau rất nhiều lần gõ.","Some doors only open after a great many knocks."],["Hãy dành thời gian cho những người khiến bạn cảm thấy được là chính mình.","Spend time with people who let you be yourself."],["Đừng sống để có một cuộc đời trông thật thành công; hãy sống một cuộc đời thực sự có ý nghĩa.","Don't live to have a life that merely looks successful; live one that truly has meaning."],["Sự tò mò là khởi đầu của mọi khám phá vĩ đại.","Curiosity is the beginning of every great discovery."],["Đôi khi, lòng can đảm chỉ đơn giản là thành thật với chính mình.","Sometimes courage is simply being honest with yourself."],["Hãy biết điều gì đáng để bạn dành thời gian và điều gì nên buông bỏ.","Know what deserves your time and what you should let go."],["Một giờ tập trung hôm nay có thể tiết kiệm hàng giờ hối tiếc ngày mai.","One hour of focus today can save hours of regret tomorrow."],["Bạn không cần phải làm hài lòng tất cả mọi người để có một cuộc sống ý nghĩa.","You don't have to please everyone to live a meaningful life."],["Hãy nhớ rằng ngay cả những mùa đông dài nhất cũng không kéo dài mãi mãi.","Remember that even the longest winters don't last forever."],["Một tâm hồn biết trân trọng những điều giản dị sẽ tìm thấy vẻ đẹp ở nhiều nơi.","A soul that treasures simple things will find beauty in many places."],["Đừng ngại bắt đầu từ con số không; mọi thành tựu đều từng bắt đầu như thế.","Don't be afraid to start from zero; every achievement once began that way."],["Sự trưởng thành thể hiện qua cách bạn đối xử với người khác khi không nhận được điều mình mong muốn.","Maturity shows in how you treat others when you don't get what you wanted."],["Hãy biến những điều bạn thường nghĩ đến thành những việc bạn thực sự làm.","Turn the things you often think about into things you actually do."],["Thành công không có một định nghĩa duy nhất; hãy tự viết nên định nghĩa của mình.","Success has no single definition; write your own."],["Đừng học chỉ để vượt qua kỳ thi, hãy học để hiểu cuộc sống.","Don't study only to pass an exam; study to understand life."],["Hãy để khó khăn rèn luyện bạn, đừng để nó định nghĩa bạn.","Let hardship train you, but don't let it define you."],["Đừng chờ có tất cả mới cảm thấy mình đang có một cuộc sống tốt đẹp.","Don't wait until you have everything to feel you're living a good life."],["Hãy làm những việc cần làm, ngay cả khi bạn không cảm thấy muốn làm.","Do what needs to be done, even when you don't feel like doing it."],["Đừng để quá khứ thuyết phục bạn rằng tương lai cũng sẽ giống như vậy.","Don't let the past convince you the future will be the same."],["Hãy dành năng lượng cho những thứ bạn có thể thay đổi.","Spend your energy on what you can change."],["Bạn không cần phải luôn mạnh mẽ; được yếu lòng cũng là một phần của con người.","You don't always have to be strong; being vulnerable is part of being human."],["Mỗi kỹ năng mới là một phiên bản mới của chính bạn đang được mở khóa.","Every new skill is a new version of yourself being unlocked."],["Một quyết định can đảm hôm nay có thể thay đổi nhiều năm sau này.","One brave decision today can change the years ahead."],["Hãy sống có chủ đích, thay vì để ngày tháng trôi qua một cách vô thức.","Live with intention instead of letting the days slip by unnoticed."],["Hãy biết ơn những điều nhỏ bé trước khi chúng trở thành ký ức.","Be thankful for the little things before they become memories."],["Đừng đánh đổi mục tiêu dài hạn chỉ để có được sự thoải mái ngắn hạn.","Don't trade your long-term goals for short-term comfort."],["Bạn có thể vừa biết ơn quá khứ vừa không muốn quay trở lại đó.","You can be grateful for the past without wanting to go back to it."],["Hãy bắt đầu với những gì bạn có, ở nơi bạn đang đứng.","Start with what you have, from where you stand."],["Đừng để thành công của người khác khiến bạn nghi ngờ con đường của mình.","Don't let someone else's success make you doubt your own path."],["Hãy học cách đặt câu hỏi trước khi vội vàng tìm câu trả lời.","Learn to ask questions before rushing to find answers."],["Một người kiên trì có thể đi xa hơn một người chỉ tài năng nhưng dễ bỏ cuộc.","A persistent person can go further than a talented one who gives up easily."],["Bạn không cần phải giải thích mọi lựa chọn cá nhân với tất cả mọi người.","You don't have to explain every personal choice to everyone."],["Hãy để hành động của bạn lớn hơn những lời hứa.","Let your actions be bigger than your promises."],["Đừng để sự bận rộn khiến bạn quên mất cách tận hưởng cuộc sống.","Don't let busyness make you forget how to enjoy life."],["Hãy dũng cảm chọn con đường phù hợp với mình, ngay cả khi nó khác biệt.","Bravely choose the path that suits you, even if it's different."],["Không phải mọi cuộc tranh luận đều cần một người chiến thắng.","Not every argument needs a winner."],["Đầu tư vào tri thức là một khoản đầu tư mà không ai có thể dễ dàng lấy đi.","Investing in knowledge is an investment no one can easily take from you."],["Đừng chờ đến khi đạt được thành tựu mới cho phép mình hạnh phúc.","Don't wait for an achievement before allowing yourself to be happy."],["Những thói quen nhỏ hôm nay đang âm thầm định hình cuộc đời ngày mai.","Today's small habits are quietly shaping tomorrow's life."],["Hãy học cách lắng nghe trước khi muốn được thấu hiểu.","Learn to listen before wanting to be understood."],["Bạn không cần phải đi thật xa mới tìm thấy những điều đáng trân trọng.","You don't have to travel far to find things worth treasuring."],["Một tâm trí ham học hỏi sẽ không bao giờ thực sự nghèo nàn.","A mind eager to learn is never truly poor."],["Đừng để một ngày tồi tệ khiến bạn nghi ngờ cả một hành trình tốt đẹp.","Don't let one bad day make you doubt a whole good journey."],["Hãy để ước mơ lớn hơn nỗi sợ thất bại.","Let your dreams be bigger than your fear of failing."],["Người có phương hướng sẽ không dễ dàng bị mọi ngã rẽ làm mất phương hướng.","Someone with direction isn't easily lost at every turn."],["Hãy tự hào về những tiến bộ mà không cần chờ ai công nhận.","Be proud of your progress without waiting for anyone to acknowledge it."],["Đừng chỉ hỏi mình muốn đạt được điều gì, hãy hỏi mình muốn trở thành người như thế nào.","Don't only ask what you want to achieve; ask who you want to become."],["Hãy học cách nghỉ ngơi mà không cảm thấy có lỗi.","Learn to rest without feeling guilty."],["Bạn không thể thay đổi quá khứ, nhưng có thể thay đổi cách nó ảnh hưởng đến tương lai.","You can't change the past, but you can change how it affects your future."],["Đừng đánh giá cả một năm chỉ bằng những tháng ngày khó khăn nhất.","Don't judge a whole year by its hardest days alone."],["Mỗi ngày là một cơ hội để viết lại định nghĩa về chính mình.","Every day is a chance to rewrite your definition of yourself."],["Đừng sống một cuộc đời chỉ để tránh mắc sai lầm.","Don't live a life only to avoid making mistakes."],["Hãy dành thời gian suy ngẫm về người mà bạn đang trở thành.","Take time to reflect on the person you're becoming."],["Đừng để sự thoải mái trở thành chiếc lồng vô hình của cuộc đời.","Don't let comfort become the invisible cage of your life."],["Hãy dám đặt mục tiêu mà phiên bản hiện tại của bạn chưa biết cách đạt được.","Dare to set goals your current self doesn't yet know how to reach."],["Một lời tử tế có thể trở thành ánh sáng trong ngày khó khăn của ai đó.","One kind word can become a light on someone's hard day."],["Hãy học cách suy nghĩ, thay vì chỉ học cách tìm kiếm đáp án.","Learn how to think, not just how to look up the answer."],["Đừng để một sai lầm khiến bạn quên đi tất cả những điều tốt đẹp mình đã làm.","Don't let one mistake make you forget all the good you've done."],["Sự bền bỉ không phải là không bao giờ gục ngã, mà là luôn tìm cách đứng lên.","Resilience isn't never falling; it's always finding a way to get back up."],["Hãy dành thời gian cho những điều khiến trí tuệ của bạn trở nên phong phú hơn.","Make time for what enriches your mind."],["Đừng để những lo lắng về ngày mai lấy đi sự bình yên của ngày hôm nay.","Don't let worry about tomorrow steal today's peace."],["Hãy chọn trải nghiệm thay vì hối tiếc.","Choose experience over regret."],["Bạn không cần biết tất cả câu trả lời để tiếp tục hành trình.","You don't need all the answers to continue your journey."],["Hãy biến ước mơ thành mục tiêu, mục tiêu thành kế hoạch và kế hoạch thành hành động.","Turn dreams into goals, goals into plans, and plans into action."],["Một cuộc trò chuyện sâu sắc đôi khi có giá trị hơn hàng trăm cuộc gặp gỡ hời hợt.","One deep conversation can be worth more than a hundred shallow meetings."],["Đừng ngừng phát triển chỉ vì người khác đã quen với phiên bản cũ của bạn.","Don't stop growing just because others are used to the old you."],["Hãy nhớ rằng bạn vẫn còn thời gian để trở thành phiên bản mà mình mong muốn.","Remember, you still have time to become the person you want to be."],["Thành công thường được tạo nên trong những ngày chẳng có ai nhìn thấy bạn cố gắng.","Success is often built on days when no one sees you trying."],["Bạn có thể mệt mỏi, có thể nghỉ ngơi, nhưng đừng vội kết luận rằng mình không thể.","You may be tired, you may rest, but don't rush to conclude that you can't."],["Đừng nhầm lẫn giữa chuyển động liên tục và tiến bộ thực sự.","Don't confuse constant motion with real progress."],["Hãy trở thành người mà chính bạn cũng cảm thấy an toàn khi ở bên.","Become someone you yourself feel safe being around."],["Đừng sợ những lĩnh vực mới; mọi chuyên gia đều từng là người mới bắt đầu.","Don't fear new fields; every expert was once a beginner."],["Hãy sống sao cho mỗi buổi sáng đều có một lý do khiến bạn muốn thức dậy.","Live so that every morning gives you a reason to get up."],["Không phải mọi thành công đều cần được công khai.","Not every success needs to be made public."],["Hãy chọn phản ứng bằng sự bình tĩnh thay vì phản xạ bằng cảm xúc.","Choose to respond with calm instead of reacting with emotion."],["Hãy biến sự tò mò thành thói quen và tri thức thành sức mạnh.","Turn curiosity into a habit and knowledge into strength."],["Đừng để một năm kết thúc mà không dành cho bản thân một lời cảm ơn.","Don't let a year end without giving yourself a thank-you."],["Sự thay đổi bắt đầu khi bạn ngừng chấp nhận những điều khiến mình trì trệ.","Change begins when you stop accepting what keeps you stuck."],["Một ngày có kế hoạch tốt là một ngày bạn chủ động sống thay vì chỉ phản ứng.","A well-planned day is one you actively live instead of merely reacting to."],["Hãy cho bản thân quyền được thay đổi suy nghĩ, ước mơ và con đường.","Give yourself permission to change your thoughts, your dreams and your path."],["Không phải mọi thứ bạn mất đi đều là một mất mát.","Not everything you lose is a loss."],["Hãy tạo ra những kỷ niệm đẹp trong khi bạn vẫn đang sống những ngày bình thường.","Create beautiful memories while you're still living ordinary days."],["Người thông thái không phải người biết tất cả, mà là người luôn biết mình còn nhiều điều cần học.","A wise person isn't someone who knows everything, but someone who knows how much there is still to learn."],["Đừng để những ngày khó khăn khiến bạn quên mất lý do mình bắt đầu.","Don't let hard days make you forget why you started."],["Đôi khi, điều bạn cần không phải một kế hoạch mới mà là một khoảng nghỉ thật sự.","Sometimes what you need isn't a new plan but a real break."],["Hãy tập trung vào tiến bộ thay vì liên tục tìm kiếm sự hoàn hảo.","Focus on progress instead of endlessly chasing perfection."],["Một người bạn tốt có thể khiến những hành trình khó khăn trở nên nhẹ nhàng hơn.","A good friend can make hard journeys feel lighter."],["Hãy dũng cảm chọn điều đúng đắn, ngay cả khi đó không phải điều dễ dàng.","Bravely choose what is right, even when it isn't easy."],["Đừng chờ người khác trao cho bạn quyền được sống cuộc đời của mình.","Don't wait for others to grant you the right to live your own life."],["Hãy làm tốt những việc nhỏ trước khi mong đợi được giao phó những việc lớn.","Do small things well before expecting to be trusted with big ones."],["Hãy để mỗi cuộc trò chuyện trở thành một cơ hội học hỏi.","Let every conversation become a chance to learn."],["Đừng biến cuộc đời mình thành cuộc thi để giành lấy sự công nhận của người khác.","Don't turn your life into a contest for other people's approval."],["Mỗi lần đứng dậy sau vấp ngã, bạn hiểu thêm một chút về sức mạnh của mình.","Each time you rise after a stumble, you learn a little more about your strength."],["Hãy bảo vệ thời gian của mình như cách bạn bảo vệ những điều quý giá.","Protect your time the way you protect what is precious."],["Không phải mọi ngày đều phải rực rỡ mới đáng nhớ.","Not every day has to be dazzling to be worth remembering."],["Hãy dám trở thành người mới trong một lĩnh vực mà bạn yêu thích.","Dare to be a beginner in a field you love."],["Đừng để những tiếng ồn bên ngoài làm bạn quên đi tiếng nói bên trong.","Don't let outside noise make you forget your inner voice."],["Một năm không hoàn hảo vẫn có thể là một năm đầy ý nghĩa.","An imperfect year can still be a deeply meaningful one."],["Hãy ngừng tự trừng phạt mình vì những điều bạn chưa biết ở quá khứ.","Stop punishing yourself for what you didn't know in the past."],["Đừng sợ phải đi chậm khi bạn đang xây dựng điều gì đó có ý nghĩa lâu dài.","Don't be afraid to go slowly when you're building something that will last."],["Một tâm trí trưởng thành biết phân biệt điều gì đáng quan tâm và điều gì nên bỏ qua.","A mature mind can tell what deserves care and what should be ignored."],["Hãy dành sự chú ý cho điều bạn muốn phát triển, không chỉ điều bạn muốn tránh né.","Give your attention to what you want to grow, not only to what you want to avoid."],["Bạn không thể khám phá những vùng đất mới nếu luôn bám chặt vào bờ an toàn.","You can't discover new lands if you cling forever to the safe shore."],["Đừng để việc theo đuổi ngày mai khiến bạn bỏ lỡ vẻ đẹp của hôm nay.","Don't let chasing tomorrow make you miss the beauty of today."],["Hãy học cách trở thành người bạn tốt nhất của chính mình.","Learn to become your own best friend."],["Những người đi xa thường là những người biết kiên nhẫn với chính mình.","Those who go far are usually patient with themselves."],["Hãy làm chủ sự chú ý, bởi sự chú ý đang định hình cuộc đời bạn.","Master your attention, because attention is shaping your life."],["Đừng chỉ nhớ đến người khác khi bạn cần họ.","Don't remember others only when you need them."],["Sự khiêm tốn giúp bạn học được những điều mà sự kiêu ngạo sẽ khiến bạn bỏ lỡ.","Humility teaches you what arrogance would make you miss."],["Bạn không cần phải tiến thật nhanh, chỉ cần đừng mãi đứng yên.","You don't need to move fast, just don't stand still forever."],["Hãy học cách chấp nhận rằng mỗi người có một hành trình và tốc độ trưởng thành khác nhau.","Learn to accept that everyone has their own journey and pace of growing up."],["Đừng xây dựng thành công bằng cách phá hủy sức khỏe và những mối quan hệ quan trọng.","Don't build success by destroying your health and the relationships that matter."],["Một khởi đầu nhỏ vẫn tốt hơn một kế hoạch hoàn hảo chưa bao giờ được thực hiện.","A small start is better than a perfect plan that never gets carried out."],["Hãy học cách cho đi mà không luôn mong đợi được nhận lại.","Learn to give without always expecting something in return."],["Đừng để sự phân tâm đánh cắp những năm tháng đẹp nhất của bạn.","Don't let distraction steal the best years of your life."],["Bạn không cần phải làm tất cả trong một ngày; hãy cố gắng không bỏ quên điều quan trọng.","You don't have to do everything in one day; just try not to forget what's important."],["Hãy giữ lời hứa với bản thân, đặc biệt là những lời hứa không ai biết.","Keep the promises you make to yourself, especially the ones no one knows about."],["Đừng ngại hỏi những câu hỏi đơn giản; sự hiểu biết bắt đầu từ sự tò mò.","Don't be afraid to ask simple questions; understanding begins with curiosity."],["Đôi khi, rời đi cũng cần nhiều dũng khí như ở lại.","Sometimes leaving takes as much courage as staying."],["Một cuộc đời ý nghĩa được tạo nên từ nhiều ngày sống có chủ đích.","A meaningful life is made of many days lived with intention."],["Hãy trân trọng những người vẫn ở bên bạn trong những ngày không có gì đặc biệt.","Cherish the people who stay by your side on days when nothing special happens."],["Bạn không cần phải chứng minh điều gì với thế giới, chỉ cần không phản bội những điều mình tin tưởng.","You don't have to prove anything to the world, just don't betray what you believe in."],["Hãy dành thời gian chăm sóc tâm hồn, không chỉ chăm chút cho vẻ ngoài.","Take time to care for your soul, not only your appearance."],["Hãy giữ lại những bài học, không nhất thiết phải giữ lại mọi nỗi đau.","Keep the lessons; you don't have to keep every pain."],["Bạn không thất bại khi phải thử lại; bạn chỉ đang học một cách tốt hơn.","You haven't failed when you try again; you're just learning a better way."],["Hãy sống đủ sâu để cảm nhận, đủ chậm để quan sát và đủ tỉnh táo để biết ơn.","Live deeply enough to feel, slowly enough to notice, and awake enough to be grateful."],["Đừng chỉ mơ về một cuộc sống tốt đẹp, hãy xây dựng nó từng ngày.","Don't just dream of a good life; build it day by day."],["Hãy học cách đặt giới hạn với những điều không còn phù hợp.","Learn to set boundaries with what no longer fits."],["Đôi khi, chiến thắng lớn nhất là không để nghịch cảnh thay đổi con người tốt đẹp của bạn.","Sometimes the greatest victory is not letting hardship change the good person you are."],["Hãy dành năng lượng cho những điều thực sự quan trọng.","Spend your energy on what truly matters."],["Đừng chờ đến khi sẵn sàng mới bắt đầu; chính hành trình sẽ khiến bạn trưởng thành.","Don't wait until you're ready to begin; the journey itself will help you grow."],["Một tâm hồn biết trân trọng những điều giản dị sẽ tìm thấy vẻ đẹp ở nhiều nơi.","A soul that treasures simple things will find beauty in many places."],["Hãy học cách tha thứ cho bản thân.","Learn to forgive yourself."],["Thành công thực sự là khi bạn có thể sống gần hơn với những điều mình tin tưởng.","True success is being able to live closer to what you believe in."],["Đừng để một khoảnh khắc nóng giận phá hỏng những điều cần nhiều năm để xây dựng.","Don't let a moment of anger ruin what took years to build."],["Mỗi điều mới bạn học hôm nay đều mở thêm một cánh cửa cho tương lai.","Everything new you learn today opens another door to the future."],["Đừng đánh mất hiện tại vì quá bận tâm đến một tương lai chưa đến.","Don't lose the present by worrying too much about a future that hasn't arrived."],["Hãy biết dừng lại trước những điều không còn phù hợp cũng là một dạng tiến bộ.","Knowing when to stop what no longer fits is also a form of progress."],["Bạn không cần phải luôn mạnh mẽ; được yếu lòng cũng là một phần của con người.","You don't always have to be strong; being vulnerable is part of being human."],["Đừng để nỗi sợ về một tương lai chưa xảy ra cướp mất cơ hội của hiện tại.","Don't let fear of a future that hasn't happened rob you of the present's chances."],["Hãy học cách yêu thương mà không kiểm soát và quan tâm mà không áp đặt.","Learn to love without controlling and to care without imposing."],["Sự tự do thực sự đến từ khả năng làm chủ bản thân.","True freedom comes from the ability to master yourself."],["Hãy để trải nghiệm dạy bạn, nhưng đừng để tổn thương khiến bạn trở nên cay nghiệt.","Let experience teach you, but don't let hurt make you bitter."],["Những hạt giống không nảy mầm ngay ngày hôm sau, và nỗ lực của bạn cũng vậy.","Seeds don't sprout the very next day, and neither does your effort."],["Hãy tạo ra giá trị trước khi mong đợi nhận được sự công nhận.","Create value before expecting recognition."],["Đừng chỉ hỏi mình muốn đạt được điều gì, hãy hỏi mình muốn trở thành người như thế nào.","Don't just ask what you want to achieve; ask who you want to become."],["Hãy học cách lắng nghe để hiểu, không chỉ để chờ đến lượt mình nói.","Learn to listen in order to understand, not just to wait for your turn to speak."],["Bạn không cần một cuộc đời mới, đôi khi bạn chỉ cần một quyết định mới.","You don't need a new life; sometimes you just need a new decision."],["Hãy để những gì bạn xây dựng hôm nay trở thành món quà dành cho chính mình trong tương lai.","Let what you build today become a gift to your future self."],["Hãy sống sao cho mỗi năm trôi qua, bạn hiểu mình hơn một chút và yêu cuộc sống hơn một chút.","Live so that with each passing year you understand yourself a little more and love life a little more."],["Đừng để một vài người không tốt khiến bạn ngừng tin vào lòng tốt.","Don't let a few unkind people make you stop believing in kindness."],["Mỗi lần vượt qua sự trì hoãn, bạn đang xây dựng lòng tin vào chính mình.","Every time you overcome procrastination, you build trust in yourself."],["Một tâm trí biết trân trọng những điều giản dị sẽ tìm thấy vẻ đẹp ở nhiều nơi.","A mind that treasures simple things will find beauty in many places."],["Hãy học cách chịu trách nhiệm mà không biến mọi sai lầm thành sự tự trách.","Learn to take responsibility without turning every mistake into self-blame."],["Đừng để xuất phát điểm quyết định giới hạn cuối cùng của bạn.","Don't let your starting point decide your final limit."],["Hãy dành thời gian cho những điều khiến trí tuệ của bạn trở nên phong phú hơn.","Make time for what enriches your mind."],["Đôi khi, im lặng là câu trả lời khôn ngoan nhất.","Sometimes silence is the wisest answer."],["Đừng để sự nghi ngờ thuyết phục bạn rằng mình không thể.","Don't let doubt convince you that you can't."],["Một ngày bình thường cũng có thể chứa đựng những điều phi thường.","An ordinary day can hold extraordinary things."],["Hãy dám nghĩ lớn nhưng bắt đầu bằng những hành động thực tế.","Dare to think big, but begin with practical actions."],["Bạn có thể yêu thương người khác mà không bỏ quên chính mình.","You can love others without forgetting yourself."],["Đừng đánh giá bản thân chỉ qua những gì bạn chưa đạt được.","Don't judge yourself only by what you haven't achieved yet."],["Hãy nhớ rằng ai cũng đang học cách sống lần đầu tiên, kể cả bạn.","Remember that everyone is learning how to live for the first time, you included."],["Hãy chọn một vài điều quan trọng và dành cho chúng sự tập trung xứng đáng.","Choose a few important things and give them the focus they deserve."],["Một người trưởng thành biết khi nào nên cố gắng và khi nào nên dừng lại.","A mature person knows when to push on and when to stop."],["Đừng chỉ thu thập kiến thức, hãy biến nó thành hiểu biết.","Don't just gather knowledge; turn it into understanding."],["Bạn không cần phải đi nhanh hơn người khác để đến được nơi mình muốn.","You don't have to go faster than others to reach where you want to be."],["Hãy biết ơn những người đã giúp bạn trưởng thành, kể cả khi bài học đến từ những trải nghiệm không dễ dàng.","Be grateful to those who helped you grow, even when the lesson came through hard experiences."],["Hãy biến những điều tốt đẹp thành thói quen, không phải những ngoại lệ.","Make good things your habits, not your exceptions."],["Không phải mọi lời chỉ trích đều xứng đáng trở thành tiếng nói bên trong bạn.","Not every criticism deserves to become your inner voice."],["Đừng hy sinh tất cả những gì đang có chỉ để chạy theo những gì chưa có.","Don't sacrifice everything you have just to chase what you don't yet have."],["Đừng chờ cuộc sống trở nên dễ dàng rồi mới cố gắng.","Don't wait for life to get easy before you try."],["Hãy dám đặt mục tiêu đủ lớn để truyền cảm hứng và đủ cụ thể để bắt đầu.","Dare to set goals big enough to inspire and specific enough to start."],["Một lời cảm ơn chân thành có thể làm ấm lòng cả người nói lẫn người nghe.","A sincere thank-you can warm the heart of both the speaker and the listener."],["Hãy dành thời gian cho gia đình và những người đã luôn ở bên bạn.","Make time for your family and the people who have always been there for you."],["Đừng sống một cuộc đời chỉ để tránh mắc sai lầm.","Don't live a life only to avoid making mistakes."],["Bạn có thể tự hào về bản thân ngay cả khi vẫn còn nhiều điều cần cải thiện.","You can be proud of yourself even when there's still much to improve."],["Hãy tập trung vào việc mình có thể làm hôm nay thay vì lo lắng về tất cả những gì còn lại.","Focus on what you can do today instead of worrying about everything that remains."],["Hãy can đảm chấp nhận rằng bạn không thể làm hài lòng tất cả mọi người.","Have the courage to accept that you can't please everyone."],["Đừng để những ngày bạn không muốn cố gắng nhất trở thành những ngày bạn bỏ cuộc.","Don't let the days you least want to try become the days you give up."],["Hãy học cách nhận ra khi nào mình cần nghỉ ngơi.","Learn to recognize when you need rest."],["Tri thức giúp bạn nhìn thấy những cơ hội mà sự thiếu hiểu biết có thể khiến bạn bỏ lỡ.","Knowledge helps you see opportunities that ignorance might make you miss."],["Hãy để mục tiêu thúc đẩy bạn, nhưng đừng để chúng khiến bạn quên tận hưởng hành trình.","Let goals push you forward, but don't let them make you forget to enjoy the journey."],["Đừng để cái tôi lớn hơn khát vọng được học hỏi.","Don't let your ego grow bigger than your desire to learn."],["Một trái tim biết biết ơn sẽ không dễ dàng bỏ qua những điều giản dị.","A grateful heart doesn't easily overlook simple things."],["Hãy học cách nói không với những điều khiến bạn phải đánh mất chính mình.","Learn to say no to what makes you lose yourself."],["Đừng nhầm lẫn giữa việc cần nghỉ ngơi và việc muốn từ bỏ.","Don't confuse needing rest with wanting to quit."],["Hãy dành thời gian cho những điều thực sự khiến bạn cảm thấy sống.","Make time for what truly makes you feel alive."],["Không có bước tiến nào là vô nghĩa nếu nó đưa bạn gần hơn đến mục tiêu.","No step forward is meaningless if it brings you closer to your goal."],["Hãy học cách nhìn nhận vấn đề từ nhiều góc độ trước khi đưa ra phán xét.","Learn to look at a problem from many angles before passing judgment."],["Một cuộc sống đáng tự hào không nhất thiết phải là cuộc sống khiến người khác ghen tị.","A life to be proud of isn't necessarily one that makes others envious."],["Hãy tiếp tục, bởi bạn chưa biết những điều tuyệt vời nào đang chờ phía trước.","Keep going, because you don't yet know what wonderful things lie ahead."],["Đừng để một thất bại trở thành định nghĩa về con người bạn.","Don't let one failure become the definition of who you are."],["Hãy trân trọng những khoảnh khắc bình thường.","Cherish ordinary moments."],["Người có kỷ luật không phụ thuộc hoàn toàn vào cảm hứng.","A disciplined person doesn't depend entirely on inspiration."],["Đừng chỉ học cách làm việc chăm chỉ, hãy học cách làm việc thông minh.","Don't just learn to work hard; learn to work smart."],["Bạn không cần phải biết tất cả để bắt đầu học một điều mới.","You don't need to know everything to start learning something new."],["Đôi khi, sự trưởng thành bắt đầu bằng một quyết định rất khó khăn.","Sometimes maturity begins with a very hard decision."],["Hãy sống một cuộc đời mà bạn không cần liên tục trốn khỏi nó.","Live a life you don't constantly need to escape from."],["Đừng để những điều chưa xảy ra khiến bạn không trân trọng những gì đã có.","Don't let what hasn't happened keep you from appreciating what you already have."],["Hãy cho bản thân cơ hội được thay đổi.","Give yourself the chance to change."],["Mỗi ngày bạn không bỏ cuộc là một ngày bạn tiến gần hơn đến điều mình mong muốn.","Every day you don't give up is a day closer to what you long for."],["Hãy để sự tò mò dẫn bạn đến những chân trời mới.","Let curiosity lead you to new horizons."],["Đừng đánh mất bản thân trong hành trình làm hài lòng người khác.","Don't lose yourself in the effort to please others."],["Sự tử tế không khiến bạn yếu đuối; nó thể hiện sức mạnh của một trái tim biết thấu cảm.","Kindness doesn't make you weak; it shows the strength of a heart that understands."],["Đừng cố gắng thay đổi người khác khi bạn còn chưa học cách hiểu chính mình.","Don't try to change others before you've learned to understand yourself."],["Hãy sống sao cho mỗi ngày đều có điều gì đó đáng để biết ơn.","Live so that every day holds something to be thankful for."],["Bạn không đến quá muộn, bạn chỉ đang đi trên hành trình của riêng mình.","You aren't too late; you're simply on your own journey."],["Đừng chỉ hỏi mình đã làm được bao nhiêu, hãy hỏi mình đã học được những gì.","Don't just ask how much you've done; ask what you've learned."],["Hãy chọn điều đúng đắn, ngay cả khi đó không phải điều dễ dàng.","Choose what is right, even when it isn't easy."],["Đừng để sự bận rộn khiến bạn quên mất lý do mình bắt đầu.","Don't let busyness make you forget why you started."],["Hãy biết trân trọng những người khiến bạn muốn trở thành một con người tốt đẹp hơn.","Cherish those who make you want to become a better person."],["Không phải mọi ngày đều cần phải hiệu quả; đôi khi chỉ cần bình yên.","Not every day needs to be productive; sometimes peace is enough."],["Hãy biến tham vọng thành động lực, không phải áp lực.","Turn ambition into motivation, not pressure."],["Đừng ngừng học chỉ vì bạn đã rời khỏi trường học.","Don't stop learning just because you've left school."],["Hãy để mỗi trải nghiệm trở thành một bài học, không phải một chiếc xiềng xích.","Let every experience become a lesson, not a chain."],["Bạn có quyền sống chậm lại trong một thế giới luôn thúc giục mọi người phải nhanh hơn.","You have the right to slow down in a world that keeps urging everyone to go faster."],["Đừng chờ người khác công nhận những nỗ lực của bạn mới cảm thấy tự hào.","Don't wait for others to acknowledge your efforts before you feel proud."],["Hãy sống đủ chân thành để không phải giả vờ trở thành một người khác.","Live sincerely enough that you never have to pretend to be someone else."],["Hãy xây dựng một cuộc sống khiến bạn tự hào, không chỉ một hình ảnh khiến người khác ngưỡng mộ.","Build a life you're proud of, not just an image others admire."],["Không phải mọi điều bạn cảm nhận đều phản ánh toàn bộ sự thật.","Not everything you feel reflects the whole truth."],["Đừng để một ngày tồi tệ khiến bạn nghi ngờ cả một hành trình tốt đẹp.","Don't let one bad day make you doubt a whole good journey."],["Một người biết chịu trách nhiệm sẽ luôn có cơ hội thay đổi cuộc đời mình.","A person who takes responsibility will always have a chance to change their life."],["Hãy dành thời gian cho những điều làm tâm hồn bạn phong phú.","Make time for what makes your soul richer."],["Đừng sống để chứng minh điều gì với người khác.","Don't live to prove something to others."],["Mỗi ngày mới là một trang giấy trắng, đừng để những sai lầm cũ viết thay câu chuyện mới.","Every new day is a blank page; don't let old mistakes write the new story."],["Hãy biết trân trọng những gì bạn có trong khi vẫn nỗ lực cho những điều bạn muốn.","Appreciate what you have while still striving for what you want."],["Một cuộc đời đáng sống cần cả ước mơ lẫn sự bình yên.","A life worth living needs both dreams and peace."],["Đừng để sự thoải mái hôm nay đánh đổi những cơ hội của ngày mai.","Don't trade today's comfort for tomorrow's opportunities."],["Hãy giữ cho mình một tâm trí luôn tò mò và một trái tim luôn biết ơn.","Keep a mind that stays curious and a heart that stays grateful."],["Thành công không đòi hỏi bạn phải hoàn hảo, nó đòi hỏi bạn phải bền bỉ.","Success doesn't require you to be perfect; it requires you to be persistent."],["Đừng ngại thử lại với một phương pháp khác.","Don't be afraid to try again with a different method."],["Hãy học cách buông bỏ những kỳ vọng không còn phù hợp với con người hiện tại.","Learn to let go of expectations that no longer fit who you are now."],["Một người tử tế không cần phải luôn được mọi người yêu thích.","A kind person doesn't need to be liked by everyone."],["Đừng để nỗi sợ thất bại khiến bạn bỏ lỡ cơ hội trưởng thành.","Don't let fear of failure make you miss the chance to grow."],["Hãy nhớ rằng bạn đã đi một quãng đường dài hơn những gì đôi khi bạn tự nhận ra.","Remember, you've come a longer way than you sometimes realize."],["Mỗi kỹ năng bạn học hôm nay có thể trở thành cơ hội của ngày mai.","Every skill you learn today can become tomorrow's opportunity."],["Đừng quên dành cho mình một lời cảm ơn vì đã cố gắng.","Don't forget to thank yourself for trying."],["Hãy lựa chọn điều có ý nghĩa thay vì điều chỉ mang lại sự hài lòng tức thời.","Choose what is meaningful over what only brings instant satisfaction."],["Những ngày khó khăn không tồn tại mãi mãi.","Hard days don't last forever."],["Đừng sống theo kỳ vọng của người khác đến mức quên mất ước mơ của chính mình.","Don't live by others' expectations so much that you forget your own dreams."],["Hãy dành sự quan tâm cho những người thực sự quan trọng.","Give your care to the people who truly matter."],["Một người có tri thức nhưng thiếu khiêm tốn vẫn còn nhiều điều cần học.","A person with knowledge but no humility still has much to learn."],["Đừng cố gắng hoàn thành tất cả trong một ngày.","Don't try to finish everything in one day."],["Hãy tiếp tục tin vào những điều tốt đẹp sau những lần thất vọng.","Keep believing in good things after disappointments."],["Bạn có thể bắt đầu lại bất cứ khi nào bạn nhận ra mình đang đi sai hướng.","You can start over whenever you realize you're heading the wrong way."],["Hãy làm việc để tạo ra giá trị, không chỉ để chứng minh bản thân.","Work to create value, not just to prove yourself."],["Hãy sống đủ chậm để nhận ra những điều đẹp đẽ quanh mình.","Live slowly enough to notice the beauty around you."],["Đừng để những lời nói tiêu cực của người khác trở thành giới hạn của bạn.","Don't let other people's negative words become your limit."],["Hãy dành thời gian cho những người khiến cuộc sống trở nên ý nghĩa hơn.","Make time for the people who make life more meaningful."],["Bạn không cần phải làm mọi thứ thật hoàn hảo để có thể tiến bộ.","You don't have to do everything perfectly to make progress."],["Hãy học cách chịu trách nhiệm với lựa chọn của mình.","Learn to take responsibility for your choices."],["Đừng sợ thay đổi khi bạn biết mình cần một hướng đi khác.","Don't fear change when you know you need a different direction."],["Một người có mục tiêu rõ ràng sẽ biết cách sử dụng thời gian tốt hơn.","A person with clear goals knows how to use time better."],["Hãy trân trọng những điều nhỏ bé trước khi chúng trở thành ký ức.","Treasure the little things before they become memories."],["Đừng để những điều bạn chưa có khiến bạn quên mất những điều bạn đang sở hữu.","Don't let what you don't have make you forget what you do."],["Sự trưởng thành không phải đánh mất sự hồn nhiên, mà là biết bảo vệ nó bằng sự hiểu biết.","Growing up isn't losing your innocence, but protecting it with understanding."],["Hãy tiếp tục học hỏi ngay cả khi bạn đã đạt được những thành tựu đáng tự hào.","Keep learning even after you've achieved things to be proud of."],["Đừng để sự so sánh đánh cắp niềm vui của hành trình.","Don't let comparison steal the joy of the journey."],["Hãy lựa chọn trải nghiệm thay vì chỉ đứng ngoài quan sát.","Choose to experience life rather than just watch from the sidelines."],["Không phải mọi kết thúc đều là một điều tồi tệ.","Not every ending is a bad thing."],["Hãy xây dựng thói quen tốt trước khi mong đợi kết quả lớn.","Build good habits before expecting big results."],["Đừng chỉ sống để tồn tại, hãy sống để khám phá và trải nghiệm.","Don't live merely to exist; live to explore and experience."],["Một tâm trí bình tĩnh có thể nhìn thấy những giải pháp mà sự nóng vội bỏ qua.","A calm mind can see solutions that haste overlooks."],["Hãy dành thời gian để hiểu chính mình.","Take time to understand yourself."],["Đừng để một vài lần thất bại khiến bạn từ bỏ một điều thực sự có ý nghĩa.","Don't let a few failures make you abandon something truly meaningful."],["Hãy học cách yêu thương mà không đánh mất bản sắc của mình.","Learn to love without losing your own identity."],["Hạnh phúc không phải lúc nào cũng đến từ việc có thêm, đôi khi đến từ việc biết đủ.","Happiness doesn't always come from having more; sometimes it comes from knowing you have enough."],["Đừng chờ đến khi có thời gian hoàn hảo để bắt đầu.","Don't wait for the perfect time to begin."],["Hãy sống sao cho mỗi năm trôi qua, bạn trở nên hiểu biết và bao dung hơn.","Live so that with each passing year you become wiser and more compassionate."],["Mỗi ngày là một cơ hội để làm tốt hơn ngày hôm qua.","Every day is a chance to do better than yesterday."],["Đừng quên rằng nghỉ ngơi cũng là một phần của hành trình.","Don't forget that rest is also part of the journey."],["Hãy can đảm theo đuổi điều khiến trái tim bạn thực sự rung động.","Be brave enough to pursue what truly moves your heart."],["Đừng để những kỳ vọng không thực tế khiến bạn quên mất giá trị của bản thân.","Don't let unrealistic expectations make you forget your own worth."],["Hãy học cách nhìn nhận sai lầm như một cơ hội để phát triển.","Learn to see mistakes as opportunities to grow."],["Một cuộc sống tốt đẹp không cần phải giống với cuộc sống của bất kỳ ai khác.","A good life doesn't have to look like anyone else's."],["Hãy trân trọng những người luôn chân thành với bạn.","Cherish the people who are always sincere with you."],["Đừng ngừng tò mò về thế giới.","Never stop being curious about the world."],["Hãy để những gì bạn học được hôm nay làm nền tảng cho những điều lớn lao ngày mai.","Let what you learn today be the foundation for greater things tomorrow."],["Đôi khi, món quà quý giá nhất bạn có thể trao là sự hiện diện chân thành.","Sometimes the most precious gift you can give is your sincere presence."],["Hãy kiên nhẫn với quá trình mà bạn không thể nhìn thấy kết quả ngay lập tức.","Be patient with a process whose results you can't see right away."],["Đừng để quá khứ quyết định tất cả những gì bạn có thể trở thành.","Don't let the past decide everything you can become."],["Hãy biết khi nào nên cố gắng và khi nào nên buông bỏ.","Know when to push on and when to let go."],["Một cuộc đời ý nghĩa không được đo bằng số lượng thành tựu mà còn bằng những giá trị bạn tạo ra.","A meaningful life is measured not by the number of achievements but by the value you create."],["Đừng để sự hoàn hảo ngăn cản bạn bắt đầu.","Don't let perfection stop you from starting."],["Hãy tự hào vì bạn vẫn đang cố gắng, dù chẳng ai biết bạn đã trải qua những gì.","Be proud that you're still trying, even if no one knows what you've been through."],["Những điều đẹp đẽ nhất có thể vẫn chưa xảy ra.","The most beautiful things may still be ahead."],["Hãy làm điều đúng đắn ngay cả khi không có ai nhìn thấy.","Do the right thing even when no one is watching."],["Đừng quên tận hưởng hành trình trong khi đang theo đuổi đích đến.","Don't forget to enjoy the journey while chasing the destination."],["Một tâm trí ham học hỏi sẽ không bao giờ thực sự nghèo nàn.","A mind eager to learn is never truly poor."],["Hãy dành cho bản thân cơ hội được nghỉ ngơi và hồi phục.","Give yourself the chance to rest and recover."],["Đừng để một vài người không hiểu bạn khiến bạn nghi ngờ chính mình.","Don't let a few people who don't understand you make you doubt yourself."],["Hãy tiếp tục trở thành người mà bạn sẽ tự hào khi nhìn lại sau nhiều năm.","Keep becoming the person you'll be proud of when you look back years from now."],["Sự tử tế với bản thân cũng quan trọng như sự tử tế với người khác.","Kindness toward yourself matters as much as kindness toward others."],["Đừng ngại trở thành người mới bắt đầu.","Don't be afraid to be a beginner."],["Hãy sống sao cho mỗi ngày đều có một điều khiến bạn muốn mỉm cười.","Live so that every day holds something that makes you want to smile."],["Hãy biến sự tò mò thành động lực để khám phá những điều chưa biết.","Turn curiosity into the drive to explore the unknown."],["Đừng chỉ theo đuổi thành công, hãy theo đuổi một cuộc sống có ý nghĩa.","Don't just chase success; chase a meaningful life."],["Mỗi lần bạn chọn kiên trì, bạn đang chọn tương lai của mình.","Every time you choose to persevere, you're choosing your future."],["Hãy biết ơn những người đã giúp bạn trở thành con người hôm nay.","Be grateful to those who helped you become who you are today."],["Đừng để những thất bại cũ ngăn cản những cơ hội mới.","Don't let old failures block new opportunities."],["Một người biết lắng nghe sẽ luôn có cơ hội học được điều gì đó.","A good listener always has the chance to learn something."],["Hãy học cách trân trọng chính mình mà không cần phải trở nên hơn người khác.","Learn to value yourself without needing to be better than others."],["Đừng quên rằng cuộc sống còn nhiều điều đẹp đẽ ngoài những mục tiêu bạn đang theo đuổi.","Don't forget there's much beauty in life beyond the goals you're chasing."],["Hãy bước tiếp với sự khôn ngoan mà quá khứ đã trao cho bạn.","Move forward with the wisdom the past has given you."],["Bạn không cần biết tất cả câu trả lời để tiếp tục hành trình.","You don't need all the answers to continue your journey."],["Đừng biến một sai lầm thành lý do để ngừng cố gắng.","Don't turn one mistake into a reason to stop trying."],["Hãy để lòng biết ơn làm phong phú thêm những ngày bình thường.","Let gratitude enrich your ordinary days."],["Một ngày nào đó, những điều khiến bạn muốn bỏ cuộc hôm nay sẽ trở thành câu chuyện về sự trưởng thành của bạn.","One day, the things that make you want to quit today will become the story of your growth."],["Hãy sống sao cho mỗi buổi sáng đều có một lý do để biết ơn.","Live so that every morning holds a reason to be grateful."],["Đừng để những điều chưa hoàn thành che khuất những điều bạn đã làm được.","Don't let what's unfinished hide what you've already accomplished."],["Hãy bước ra khỏi vùng an toàn, nhưng đừng quên mang theo sự tỉnh táo.","Step out of your comfort zone, but remember to bring your good sense along."],["Một người trưởng thành biết rằng không phải mọi thứ đều cần một câu trả lời ngay lập tức.","A mature person knows that not everything needs an immediate answer."],["Đừng để những điều khẩn cấp luôn lấn át những việc quan trọng.","Don't let the urgent always crowd out the important."],["Hãy giữ cho trái tim mình dịu dàng và tâm trí mình mạnh mẽ.","Keep your heart gentle and your mind strong."],["Bạn có thể không kiểm soát được mọi điều xảy ra, nhưng có thể lựa chọn cách đối diện.","You may not control everything that happens, but you can choose how to face it."],["Hãy học cách tận hưởng những ngày bình yên mà không cần chờ đợi một sự kiện đặc biệt.","Learn to enjoy peaceful days without waiting for a special event."],["Đừng đánh mất chính mình trong cuộc chạy đua với thời gian.","Don't lose yourself in the race against time."],["Một năm sau, bạn sẽ biết ơn những nỗ lực mà bạn đang thực hiện hôm nay.","A year from now, you'll be grateful for the effort you're making today."],["Hãy sống thật với những điều bạn tin tưởng.","Live true to what you believe in."],["Đừng quên rằng mọi chuyên gia đều từng là người mới bắt đầu.","Don't forget that every expert was once a beginner."],["Hãy tiếp tục tiến lên, ngay cả khi bước chân hôm nay rất nhỏ.","Keep moving forward, even when today's steps are very small."],["Hãy dành thời gian cho những người khiến cuộc sống trở nên ý nghĩa hơn.","Make time for the people who make life more meaningful."],["Đừng để sự sợ hãi ngăn bạn khám phá khả năng của chính mình.","Don't let fear stop you from discovering your own potential."],["Một cuộc sống đáng tự hào được xây dựng từ những lựa chọn có chủ đích.","A life to be proud of is built from intentional choices."],["Hãy biết ơn phiên bản cũ đã cố gắng hết sức với những gì cô ấy biết vào thời điểm đó.","Be grateful to your former self, who did the best she could with what she knew at the time."],["Đừng chỉ cố gắng trở nên thành công, hãy cố gắng trở thành một người tốt đẹp hơn.","Don't just try to be successful; try to become a better person."],["Hãy luôn dành chỗ cho những điều mới mẻ trong cuộc sống.","Always leave room for new things in your life."],["Không phải mọi điều bạn đánh mất đều khiến cuộc sống trở nên nghèo nàn hơn.","Not everything you lose makes your life poorer."],["Hãy sống đủ sâu để hiểu rằng những điều giản dị đôi khi lại quý giá nhất.","Live deeply enough to understand that simple things are sometimes the most precious."],["Đừng sợ một chương mới chỉ vì bạn chưa biết câu chuyện sẽ diễn ra thế nào.","Don't fear a new chap const mtx=(m,f)=>idb().then(db=>new Promise((ok,no)=>{const t=db.transaction('music',m==='r'?'readonly':'readwrite'),q=f(t.objectStore('music'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}));

const adur=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);const e=v=>{try{URL.revokeObjectURL(u)}catch(x){}ok(v)};a.preload='metadata';a.onloadedmetadata=()=>e(a.duration||0);a.onerror=()=>e(0);setTimeout(()=>e(0),1500);a.src=u});
async function addSongs(fs){for(const f of fs){try{const id=uid(),du=await adur(f),nm=f.name.replace(/\.[^.]+$/,''),p=nm.split(' - ');await mput(id,f);D.items.push({id,t:'song',title:p.length>1?p.slice(1).join(' - ').trim():nm,artist:p.length>1?p[0].trim():'',c:new Date().toISOString(),u:Date.now(),dur:du})}catch(e){alert('Không lưu được “'+f.name+'”. Có thể bộ nhớ trình duyệt đã đầy.');break}}save();await mrefresh();render()}
function parseLrc(t){const L=[];let tm=0;String(t||'').split(/\r?\n/).forEach(l=>{const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],tx=l.replace(/\[[^\]]*\]/g,'').trim();if(m.length){tm++;m.forEach(x=>L.push({t:+x[1]*60+ +x[2],x:tx}))}else if(tx)L.push({t:null,x:tx})});
const plain=!tm;if(!plain)L.sort((a,b)=>(a.t??-1)-(b.t??-1));return{L:plain?L:L.filter(x=>x.t!=null),plain}}
const lines=s=>String(s.lrc||'').split(/\r?\n/).map(l=>l.replace(/\[[^\]]*\]/g,'').trim()).filter(Boolean);
async function findLy(s){const q=new URLSearchParams({track_name:s.title||'',artist_name:s.artist||''});if(s.dur)q.set('duration',Math.round(s.dur));
let r=await fetch('https://lrclib.net/api/get?'+q);if(r.ok){const j=await r.json();if(j.syncedLyrics)return{txt:j.syncedLyrics,synced:1};if(j.plainLyrics)return{txt:j.plainLyrics,synced:0}}
r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(((s.artist||'')+' '+(s.title||'')).trim()));if(!r.ok)return null;const a=await r.json(),ok=x=>!s.dur||!x.duration||Math.abs(x.duration-s.dur)<=6,b=a.find(x=>x.syncedLyrics&&ok(x))||a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics);

async function pl(id){const s=byId(id);if(!s)return;const b=await mget(id);if(!b){alert('File nhạc của bài này chưa có trên thiết bị này. Hãy bấm “Tải file” để tải lại.');return}
if(CURL)try{URL.revokeObjectURL(CURL)}catch(e){}CURL=URL.createObjectURL(b);AU.src=CURL;MS.id=id;SY=null;LC=null;try{await AU.play()}catch(e){}msess(s);render()}
function mnext(dir){const a=songs().filter(s=>MK.has(s.id));if(!a.length)return;const i=a.findIndex(s=>s.id===MS.id);if(dir<0&&AU.currentTime>3){AU.currentTime=0;return}let n;
if(MS.sh&&a.length>1){do{n=Math.floor(Math.random()*a.length)}while(a[n].id===MS.id)}else{n=i+dir;if(n>=a.length){if(MS.rp===0&&i>=0){AU.pause();AU.currentTime=0;return}n=0}if(n<0)n=a.length-1}pl(a[n].id)}
function msess(s){if(!('mediaSession' in navigator))return;try{const cv=(s.imgs||[])[0];navigator.mediaSession.metadata=new MediaMetadata({title:s.title||'Bài hát',artist:s.artist||'',album:'Minimal Diary',artwork:cv?[{src:cv,sizes:'512x512'}]:[]})}catch(e){}}
function initAudio(){AU.onplay=()=>{MS.pl=true;try{navigator.mediaSession.playbackState='playing'}catch(e){}mpUpdate();npUpdate()};AU.onpause=()=>{MS.pl=false;try{navigator.mediaSession.playbackState='paused'}catch(e){}mpUpdate();npUpdate()};
AU.onended=()=>{if(MS.rp===2){AU.currentTime=0;AU.play()}else mnext(1)};
AU.onloadedmetadata=()=>{const s=curSong();if(s&&AU.duration&&!s.dur){s.dur=AU.duration;save()}npUpdate()};
AU.ontimeupdate=()=>{npUpdate();const n=Date.now();if(n-lastPos>4000&&AU.duration){lastPos=n;try{navigator.mediaSession.setPositionState({duration:AU.duration,playbackRate:1,position:Math.min(AU.currentTime,AU.duration)})}catch(e){}}};
try{const m=navigator.mediaSession;m.setActionHandler('play',()=>AU.play());m.setActionHandler('pause',()=>AU.pause());m.setActionHandler('previoustrack',()=>mnext(-1));m.setActionHandler('nexttrack',()=>mnext(1));m.setActionHandler('seekto',d=>{AU.currentTime=d.seekTime})}catch(e){}}

if(i===LC.i)return;LC.i=i;[...box.children].forEach((e,k)=>e.classList.toggle('on',k===i));const e=box.children[i];if(e){const y=e.offsetTop-box.clientHeight/2+e.clientHeight/2;if(box.scrollTo)box.scrollTo({top:y,behavior:'smooth'});else box.scrollTop=y}}

const hs=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function shuf(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solveCount(g,lim){const rw=Array(9).fill(0),cl=Array(9).fill(0),bx=Array(9).fill(0);for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i],r=(i/9)|0,c=i%9;rw[r]|=b;cl[c]|=b;bx[((r/3)|0)*3+((c/3)|0)]|=b}
let cnt=0;const go=()=>{let bi=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){const r=(i/9)|0,c=i%9,m=~(rw[r]|cl[c]|bx[((r/3)|0)*3+((c/3)|0)])&0x3FE;let k=0,x=m;while(x){k++;x&=x-1}if(k<bc){bc=k;bi=i;bm=m;if(k<=1)break}}
if(bi<0){cnt++;return cnt>=lim}if(bc===0)return false;const r=(bi/9)|0,c=bi%9,b=((r/3)|0)*3+((c/3)|0);
for(let d=1;d<=9;d++){const bt=1<<d;if(bm&bt){g[bi]=d;rw[r]|=bt;cl[c]|=bt;bx[b]|=bt;const st=go();g[bi]=0;rw[r]&=~bt;cl[c]&=~bt;bx[b]&=~bt;if(st)return true}}return false};go();return cnt}

const sol=[];for(let i=0;i<9;i++)for(let j=0;j<9;j++)sol.push(dg[((rows[i]%3)*3+Math.floor(rows[i]/3)+cols[j])%9]);

PG.push([`Hóa học`,`Water behaves unusually when it freezes: it expands, so ice floats on liquid water. This helps lakes freeze from the top down, leaving liquid water below, where fish can survive through the winter.`,`Nước có một đặc điểm khác thường khi đóng băng: nó nở ra nên băng nổi trên mặt nước. Điều này khiến hồ đóng băng từ trên xuống, để lại lớp nước lỏng bên dưới, nơi cá có thể sống sót qua mùa đông.`],
[`Thiên văn`,`Sunlight takes about eight minutes to reach Earth, so we always see the Sun as it was a little while ago. Light from other stars can travel for years or even thousands of years, which means looking at the night sky is a bit like looking into the past.`,`Ánh sáng Mặt Trời mất khoảng tám phút để tới Trái Đất, nên ta luôn thấy Mặt Trời như nó đã từng như vậy cách đây một lúc. Ánh sáng từ các ngôi sao khác có thể đi hàng năm, thậm chí hàng nghìn năm, nên ngắm bầu trời đêm cũng giống như nhìn vào quá khứ.`],
[`Tâm lý học`,`Studies of memory suggest that reviewing information at spaced intervals works better than cramming. Each review signals to the brain that the information matters, making it easier to recall later. This is the idea behind many flashcard apps.`,`Các nghiên cứu về trí nhớ cho thấy ôn lại thông tin theo những khoảng cách thời gian hiệu quả hơn học nhồi. Mỗi lần ôn báo cho não biết thông tin này quan trọng, giúp nhớ lại dễ hơn sau này. Đây là ý tưởng của nhiều ứng dụng thẻ ghi nhớ.`],
[`Động vật`,`Crows are among the most intelligent birds. They can use tools, recognize human faces, and some have been observed solving puzzles with several steps. Their large brains relative to their body size help explain these abilities.`,`Quạ là một trong những loài chim thông minh nhất. Chúng biết dùng công cụ, nhận ra khuôn mặt người, và một số con được quan sát thấy giải được các câu đố nhiều bước. Bộ não khá lớn so với cơ thể giúp giải thích những khả năng này.`],
[`Địa lý`,`The Sahara is the largest hot desert in the world and covers a huge part of northern Africa. Yet most of it is not sand dunes; much of it is rocky plateaus and gravel plains.`,`Sahara là sa mạc nóng lớn nhất thế giới, trải rộng trên một phần lớn miền bắc châu Phi. Tuy vậy, phần lớn nơi này không phải đồi cát; nhiều nơi là cao nguyên đá và đồng bằng sỏi.`],
[`Công nghệ`,`The internet began as a research network in the late 1960s called ARPANET, which connected only a handful of computers at first. The World Wide Web, which lets us browse pages connected by links, was proposed later, around 1989, by Tim Berners-Lee.`,`Internet bắt đầu từ một mạng nghiên cứu cuối thập niên 1960 tên là ARPANET, ban đầu chỉ nối vài máy tính. World Wide Web, cho phép ta duyệt các trang nối với nhau bằng liên kết, được Tim Berners-Lee đề xuất sau đó, khoảng năm 1989.`],
[`Kinh tế`,`When many people want something that is scarce, its price tends to rise. When there is plenty of it and few buyers, the price tends to fall. This simple idea of supply and demand helps explain everything from concert tickets to fruit prices.`,`Khi nhiều người muốn một thứ khan hiếm, giá của nó có xu hướng tăng. Khi hàng nhiều mà người mua ít, giá có xu hướng giảm. Ý tưởng đơn giản về cung và cầu giúp giải thích mọi thứ, từ giá vé hòa nhạc đến giá trái cây.`],
[`Âm nhạc`,`Music can change how we feel. Research suggests that listening to music we enjoy can reduce stress and lift our mood, while playing an instrument exercises many parts of the brain at once, including hearing, movement, and memory.`,`Âm nhạc có thể thay đổi cảm xúc của ta. Các nghiên cứu cho thấy nghe nhạc mình thích có thể giảm căng thẳng và nâng cao tâm trạng, còn chơi nhạc cụ thì rèn luyện nhiều vùng não cùng lúc, gồm thính giác, vận động và trí nhớ.`],
[`Ngôn ngữ học`,`Mandarin Chinese is a tonal language: the same syllable can mean different things depending on its pitch pattern. For example, the syllable ma can mean mother, hemp, horse, or scold, depending on the tone. This is why listening practice is so important.`,`Tiếng Quan Thoại là ngôn ngữ có thanh điệu: cùng một âm tiết có thể mang nghĩa khác nhau tùy cách lên xuống giọng. Ví dụ, âm tiết ma có thể là mẹ, cây gai, con ngựa hoặc mắng, tùy thanh điệu. Vì vậy luyện nghe rất quan trọng.`],
[`Môi trường`,`Tiny ocean organisms called phytoplankton produce a large share of the oxygen in our atmosphere through photosynthesis. Scientists often estimate that roughly half of Earth's oxygen comes from the ocean, which is one reason healthy seas matter to everyone.`,`Những sinh vật biển nhỏ bé gọi là thực vật phù du tạo ra một phần lớn oxy trong khí quyển nhờ quang hợp. Các nhà khoa học thường ước tính khoảng một nửa lượng oxy của Trái Đất đến từ đại dương, đó là một lý do khiến biển khỏe mạnh quan trọng với mọi người.`],
[`Lịch sử`,`The Great Wall of China was built and rebuilt over many centuries by different dynasties, not in a single project. According to a survey by Chinese authorities, its total length, counting all its branches, is more than twenty thousand kilometers.`,`Vạn Lý Trường Thành được xây và sửa lại qua nhiều thế kỷ bởi các triều đại khác nhau, không phải trong một dự án duy nhất. Theo một cuộc khảo sát của phía Trung Quốc, tổng chiều dài của nó, tính cả các nhánh, hơn hai mươi nghìn km.`],
[`Toán học`,`The number zero as a true number with its own rules took a long time to develop. Mathematicians in ancient India helped shape it, and it later spread to the Arab world and Europe, making modern arithmetic much easier.`,`Số không, với tư cách là một con số thật sự có quy tắc riêng, mất rất lâu mới hình thành. Các nhà toán học Ấn Độ cổ đại góp phần định hình nó, rồi nó lan sang thế giới Ả Rập và châu Âu, giúp số học hiện đại dễ hơn nhiều.`],
[`Y học`,`Washing your hands with soap is one of the simplest ways to prevent infections. Soap helps lift germs off the skin so water can rinse them away, which is why scrubbing for around twenty seconds is often recommended.`,`Rửa tay bằng xà phòng là một trong những cách đơn giản nhất để phòng nhiễm trùng. Xà phòng giúp tách vi khuẩn khỏi da để nước cuốn trôi, vì vậy người ta thường khuyên chà rửa khoảng hai mươi giây.`],
[`Di truyền học`,`Almost every cell in your body contains the same DNA, a long molecule that carries instructions for building and running you. If you stretched out the DNA from a single cell, it would be about two meters long.`,`Hầu hết mọi tế bào trong cơ thể bạn đều chứa cùng một bộ DNA, một phân tử dài mang chỉ dẫn để xây dựng và vận hành cơ thể. Nếu kéo thẳng DNA từ một tế bào, nó dài khoảng hai mét.`],
[`Địa chất`,`Earth's surface is broken into large pieces called tectonic plates that move very slowly, only a few centimeters a year. Where plates collide or slide past each other, earthquakes and volcanoes are more common.`,`Bề mặt Trái Đất bị chia thành những mảng lớn gọi là mảng kiến tạo, di chuyển rất chậm, chỉ vài xăng-ti-mét mỗi năm. Ở nơi các mảng va vào nhau hoặc trượt qua nhau, động đất và núi lửa xảy ra nhiều hơn.`],
[`Văn học`,`Some studies suggest that reading fiction helps people understand other people's feelings, because stories invite us to see the world through someone else's eyes. Even a few pages a day can build vocabulary and concentration over time.`,`Một số nghiên cứu cho thấy đọc tiểu thuyết giúp ta hiểu cảm xúc của người khác hơn, vì câu chuyện mời ta nhìn thế giới bằng đôi mắt của người khác. Chỉ vài trang mỗi ngày cũng có thể giúp tăng vốn từ và khả năng tập trung theo thời gian.`]);

PG.push([`Tâm lý học`,`Writing about your feelings for just a few minutes can help you understand them better. Psychologists have found that putting emotions into words may reduce their intensity, which is one reason many people enjoy keeping a diary.`,`Viết về cảm xúc chỉ vài phút có thể giúp bạn hiểu chúng rõ hơn. Các nhà tâm lý học thấy rằng gọi tên cảm xúc bằng lời có thể làm chúng dịu bớt, đó là một lý do nhiều người thích viết nhật ký.`],[`Thói quen`,`Habits form through repetition in a steady context. Rather than aiming for perfection, it often helps to start with a very small action, such as reading one page, and do it at the same time each day.`,`Thói quen hình thành nhờ lặp lại trong một bối cảnh ổn định. Thay vì cầu toàn, thường sẽ dễ hơn nếu bắt đầu bằng hành động rất nhỏ, như đọc một trang, và làm vào cùng một giờ mỗi ngày.`],[`Thiên văn`,`The Moon is slowly moving away from Earth, by about 3.8 centimeters each year. This is roughly the speed at which your fingernails grow, and it has been happening for billions of years.`,`Mặt Trăng đang từ từ rời xa Trái Đất, khoảng 3,8 cm mỗi năm. Tốc độ này gần bằng tốc độ móng tay bạn dài ra, và nó đã diễn ra hàng tỷ năm.`],[`Ngôn ngữ`,`Chinese characters are built from smaller parts. Many have a meaning part and a sound part, so learning common components makes new characters much easier to remember.`,`Chữ Hán được ghép từ những bộ phận nhỏ hơn. Nhiều chữ có phần chỉ nghĩa và phần chỉ âm, nên học các thành phần quen thuộc giúp nhớ chữ mới dễ hơn nhiều.`],[`Giấc ngủ & học tập`,`Taking short breaks while studying can improve focus. Many people work in blocks of about 25 minutes and then rest for five, which keeps the mind fresh and makes long study sessions less tiring.`,`Nghỉ ngắn khi học có thể cải thiện sự tập trung. Nhiều người học theo từng đợt khoảng 25 phút rồi nghỉ năm phút, giúp đầu óc tươi tỉnh và buổi học dài bớt mệt hơn.`],[`Địa lý`,`The Mekong River flows through six countries before reaching the sea. Its delta in southern Vietnam is one of the most productive farming regions in Southeast Asia, famous for rice, fruit, and fish.`,`Sông Mê Kông chảy qua sáu quốc gia trước khi ra biển. Đồng bằng của nó ở miền Nam Việt Nam là một trong những vùng nông nghiệp trù phú nhất Đông Nam Á, nổi tiếng với lúa gạo, trái cây và thủy sản.`]);

const PXT=[['diary','📖','Nhật ký','Diary'],['memory','🌼','Kỷ niệm','Memories'],['moment','☕','Khoảnh khắc nhỏ','Little moments'],['book','📚','Sách đã đọc và nhật ký đọc','Books and reading log'],['week','📅','Tổng kết tuần','Weekly reviews'],['note','📝','Ghi chú','Notes'],['know','🧠','Kiến thức','Knowledge'],['dump','💭','Brain Dump','Brain dump']];
let PX={from:'',to:'',on:{diary:1,memory:1,moment:1,book:1,week:1,note:0,know:0,dump:0},grp:'type',img:'s',asc:1,title:''};
function pxPreset(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=(a,b)=>ymd(new Date(a,b,1)),l=(a,b)=>ymd(new Date(a,b+1,0));
if(k==='m'){PX.from=f(y,m);PX.to=l(y,m)}else if(k==='pm'){PX.from=f(y,m-1);PX.to=l(y,m-1)}else if(k==='y'){PX.from=f(y,0);PX.to=l(y,11)}else if(k==='py'){PX.from=f(y-1,0);PX.to=l(y-1,11)}else{PX.from='';PX.to=''}}
const pxIn=d=>{d=String(d||'').slice(0,10);if(!PX.from&&!PX.to)return true;if(!d)return false;return(!PX.from||d>=PX.from)&&(!PX.to||d<=PX.to)};
const pxPh=i=>PX.img==='n'||!(i.imgs||[]).length?'':`<div class="ph ${PX.img}">${i.imgs.map(x=>`<img src="${x}" alt="">`).join('')}</div>`;
const pxTg=i=>{const a=(i.tags||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?`<div>${a.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>`:''};
function pxEntries(){const out=[],ic=Object.fromEntries(PXT.map(x=>[x[0],x[1]]));
it('diary').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.diary&&pxIn(d))out.push({t:'diary',d,h:`<div class="en"><h3>${ic.diary} ${MOODS[i.mood]||''} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)} ${(i.date||'').slice(11,16)}</div>${clean(i.body)}${pxPh(i)}${pxTg(i)}</div>`})});
it('memory').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.memory&&pxIn(d))out.push({t:'memory',d,h:`<div class="en"><h3>${ic.memory} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)} · ${esc(OPT.cat[i.cat||0])}</div>${clean(i.body)}${i.refl?`<p><i>${esc(i.refl)}</i></p>`:''}${pxPh(i)}${pxTg(i)}</div>`})});
it('moment').forEach(i=>{const d=(i.date||'').slice(0,10);if(PX.on.moment&&pxIn(d))out.push({t:'moment',d,h:`<div class="en"><h3>${ic.moment} ${esc(i.title||'')}</h3><div class="meta">${fd(i.date)}</div>${pxPh(i)}${pxTg(i)}</div>`})});
it('book').forEach(b=>{const d=String(b.done||'').slice(0,10);if(PX.on.book&&b.stat==2&&pxIn(d)){const n=rdays(b.id);out.push({t:'book',d,h:`<div class="en"><h3>${ic.book} ${esc(b.title||'')}</h3><div class="meta">${esc(b.author||'')}${b.rate?' · '+'★'.repeat(b.rate):''}${b.start?' · '+fd(b.start)+' → ':' · '}${fd(b.done)}${n?' · '+n+' ngày thực đọc':''}${b.pages?' · '+b.pages+' trang':''}</div>${b.review?`<p>${esc(b.review)}</p>`:''}${String(b.quotes||'').split(/\r?\n/).filter(x=>x.trim()).map(q=>`<blockquote>${esc(q)}</blockquote>`).join('')}${pxPh(b)}</div>`})}});
it('week').forEach(i=>{const d=String(i.date||'').slice(0,10);if(PX.on.week&&pxIn(d)){const qa=T.week.f.filter(f=>/^q\d/.test(f[0])&&i[f[0]]).map(f=>`<p><b>${esc(f[1])}</b><br>${esc(i[f[0]])}</p>`).join('');out.push({t:'week',d,h:`<div class="en"><h3>${ic.week} ${esc(i.title||'')}</h3>${qa}</div>`})}});
[['note'],['know']].forEach(([k])=>it(k).forEach(i=>{const d=(i.c||'').slice(0,10);if(PX.on[k]&&pxIn(d))out.push({t:k,d,h:`<div class="en"><h3>${ic[k]} ${esc(i.title||'')}</h3><div class="meta">${fd(i.c)}</div>${clean(i.body)}${pxPh(i)}${pxTg(i)}</div>`})}));
it('dump').forEach(i=>{const d=(i.c||'').slice(0,10);if(PX.on.dump&&pxIn(d))out.push({t:'dump',d,h:`<div class="en"><span class="tg">${esc(OPT.dcat[i.cat||0])}</span> <span class="meta">${fd(i.c)}</span><p>${esc(i.desc||'')}</p></div>`})});
return out}
function pxBuild(){const en=pxEntries(),sg=PX.asc?1:-1,srt=a=>a.sort((x,y)=>sg*x.d.localeCompare(y.d)),lbl=Object.fromEntries(PXT.map(x=>[x[0],x[1]+' '+T2(x[2],x[3])]));
const dr=PX.from||PX.to?`${PX.from?fd(PX.from):'…'} – ${PX.to?fd(PX.to):'…'}`:T2('Tất cả thời gian','All time');
const lg=PX.on.book?it('rlog').filter(l=>pxIn(l.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date))):[],tp=lg.reduce((a,l)=>a+(+l.pages||0),0),dd=new Set(lg.map(l=>l.date)).size;
const cnt=PXT.map(x=>[x,en.filter(e=>e.t===x[0]).length]).filter(x=>x[1]).map(([x,n])=>`${x[1]} ${n}`).join(' · ');
let body='';
if(PX.grp==='type'){PXT.forEach(([k])=>{const a=srt(en.filter(e=>e.t===k));if(a.length)body+=`<h2>${lbl[k]}</h2>`+a.map(e=>e.h).join('')})}
else{let last='';srt(en).forEach(e=>{const m=e.d?(+e.d.slice(5,7))+'/'+e.d.slice(0,4):'—';if(m!==last){last=m;body+=`<h2>${T2('Tháng','Month')} ${m}</h2>`}body+=e.h})}
if(lg.length)body+=`<h2>📖 ${T2('Nhật ký đọc sách','Reading log')}</h2><p class="meta">${dd} ${T2('ngày đọc','reading days')} · ${tp} ${T2('trang','pages')}</p><table><tr><th>${T2('Ngày','Date')}</th><th>${T2('Sách','Book')}</th><th>${T2('Số trang','Pages')}</th></tr>${lg.map(l=>{const b=byId(l.book);return`<tr><td>${fd(l.date)}</td><td>${esc(b?b.title:'—')}</td><td>${l.pages}${l.est?' <span class="meta">('+T2('ước lượng','estimated')+')</span>':''}</td></tr>`}).join('')}</table>`;
return`<div class="cover"><h1>${esc(PX.title||((D.name?D.name+' – ':'')+'Minimal Diary'))}</h1><div>${dr}</div><div class="sm">${cnt||T2('Không có mục nào trong khoảng này','Nothing in this range')}${lg.length?` · 📖 ${tp} ${T2('trang đã đọc','pages read')}`:''}</div><p class="meta" style="margin-top:30px">${T2('Tạo ngày','Created on')} ${fd(new Date())}</p></div>${body||''}`}

let LB=null;
function lbOpen(im){const src=im.getAttribute('src');let a;if(im.closest('#mb')&&cur)a=cur.imgs||[];else{const c=im.closest('[data-o]'),o=c&&byId(c.dataset.o);a=o&&(o.imgs||[]).length?o.imgs:[src]}LB={a:a.length?a:[src],i:Math.max(0,a.indexOf(src))};lbShow()}
function lbShow(){const n=LB.a.length;$('#lbi').src=LB.a[LB.i];$('#lb .lbs').classList.remove('z');$('#lbc').textContent=n>1?(LB.i+1)+' / '+n:'';$('#lb').classList.add('on');$('#lb').classList.toggle('one',n<2)}
function lbGo(a){if(a==='x'){$('#lb').classList.remove('on');$('#lbi').removeAttribute('src');LB=null;return}if(!LB)return;const n=LB.a.length;LB.i=(LB.i+(a==='n'?1:-1)+n)%n;lbShow()}
(()=>{let tx=0;const l=$('#lb');l.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});l.addEventListener('touchend',e=>{if($('#lb .lbs').classList.contains('z'))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&LB&&LB.a.length>1)lbGo(dx<0?'n':'p')},{passive:true});
document.addEventListener('keydown',e=>{if(!LB)return;if(e.key==='Escape')lbGo('x');else if(e.key==='ArrowRight')lbGo('n');else if(e.key==='ArrowLeft')lbGo('p')})})();

let cur=null;

else if(ty==='num')c=`<input type="number" min="0" data-k="${k}" value="${esc(v)}">`;

else if(ty==='area')c=`<textarea data-k="${k}">${esc(v)}</textarea>`;

else if(ty==='chk')return`<label><input type="checkbox" style="width:auto;margin:0 6px 12px 0" data-k="${k}" ${v?'checked':''}>${l}</label><br>`;
else if(ty==='mood')c=`<div class="ms">${MOODS.map((m,n)=>`<span data-md="${n}" class="${v===n?'on':''}">${m}</span>`).join('')}</div>`;
else if(ty==='rich')c=`<div class="tb"><button class="btn g" data-c="bold"><b>B</b></button><button class="btn g" data-c="italic"><i>I</i></button><button class="btn g" data-c="insertUnorderedList">•</button></div><div class="rich" contenteditable data-k="${k}">${clean(v)}</div>`;
else if(ty==='img')c=`<div class="th" id="th2"></div><div class="chips"><button type="button" class="btn" data-cam="fc">📷 Chụp ảnh</button></div><input type="file" accept="image/*" capture="environment" id="fc" style="display:none"><label>Hoặc chọn ảnh từ thư viện</label><input type="file" accept="image/*" multiple id="fi">`;
